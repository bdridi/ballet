<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ballet · Scène</title>
<link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
<style>
/* Style neutre : le design system viendra plus tard. */
:root {
  --bg:#f7f7f8; --surface:#fff; --panel:#f0f1f3; --fg:#18181b; --muted:#6b6f78; --faint:#a1a5ad; --line:#e4e5e9;
  --focus:#4f46e5; --ok:#15803d; --ok-bg:#dcfce7; --warn:#b45309; --warn-bg:#fef3c7; --bad:#b91c1c; --bad-bg:#fee2e2; --run:#4f46e5;
  --dramaturg:#9333ea; --choreographer:#0d9488; --dancer:#2563eb; --critic:#ea580c; --conductor:#52525b; --director:#be123c; --script:#52525b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#0f1012; --surface:#17181b; --panel:#202226; --fg:#ececef; --muted:#9a9ea7; --faint:#62666e; --line:#2a2c31;
    --focus:#818cf8; --ok:#4ade80; --ok-bg:#14301f; --warn:#fbbf24; --warn-bg:#352a0e; --bad:#f87171; --bad-bg:#3a1717; --run:#818cf8;
    --dramaturg:#c084fc; --choreographer:#2dd4bf; --dancer:#60a5fa; --critic:#fb923c; --conductor:#a1a1aa; --director:#fb7185; --script:#a1a1aa;
  }
}
:root[data-theme="dark"] {
    --bg:#0f1012; --surface:#17181b; --panel:#202226; --fg:#ececef; --muted:#9a9ea7; --faint:#62666e; --line:#2a2c31;
    --focus:#818cf8; --ok:#4ade80; --ok-bg:#14301f; --warn:#fbbf24; --warn-bg:#352a0e; --bad:#f87171; --bad-bg:#3a1717; --run:#818cf8;
    --dramaturg:#c084fc; --choreographer:#2dd4bf; --dancer:#60a5fa; --critic:#fb923c; --conductor:#a1a1aa; --director:#fb7185; --script:#a1a1aa;
}
* { box-sizing:border-box; }
html, body { margin:0; height:100%; }
body { background:var(--bg); color:var(--fg); font:14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing:antialiased; }
a { color:inherit; text-decoration:none; }
button { font:inherit; color:inherit; cursor:pointer; }
:focus-visible { outline:2px solid var(--focus); outline-offset:2px; border-radius:4px; }
.mono, pre, code { font-family:ui-monospace, "SF Mono", Menlo, monospace; }
.muted { color:var(--muted); } .faint { color:var(--faint); }
.num { font-variant-numeric:tabular-nums; }
h1 { font-size:22px; letter-spacing:-.015em; margin:4px 0; }
h2 { font-size:15px; margin:0; }
h3 { font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); margin:0 0 8px; display:flex; align-items:center; gap:8px; }
.empty { color:var(--muted); padding:24px 0; text-align:center; }

/* rôles, pastilles, badges */
.role { display:inline-flex; align-items:center; gap:5px; font-weight:600; color:var(--r); }
.role::before { content:""; width:7px; height:7px; border-radius:50%; background:var(--r); }
.r-dramaturg { --r:var(--dramaturg); } .r-choreographer { --r:var(--choreographer); } .r-dancer { --r:var(--dancer); }
.r-critic { --r:var(--critic); } .r-conductor { --r:var(--conductor); } .r-director { --r:var(--director); } .r-script { --r:var(--script); }
.pill { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; padding:1px 8px; border-radius:999px; white-space:nowrap; background:var(--panel); color:var(--muted); }
.p-open { color:var(--run); background:color-mix(in srgb, var(--run) 14%, transparent); }
.p-open::before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; animation:blink 1.4s infinite; }
.p-escalated { color:var(--warn); background:var(--warn-bg); } .p-done { color:var(--ok); background:var(--ok-bg); }
.badge { font-size:10.5px; font-weight:700; padding:0 6px; border-radius:4px; background:var(--panel); color:var(--muted); text-transform:uppercase; letter-spacing:.03em; }
.badge.ok { background:var(--ok-bg); color:var(--ok); } .badge.warn { background:var(--warn-bg); color:var(--warn); } .badge.bad { background:var(--bad-bg); color:var(--bad); }
.kind { font-size:11px; font-weight:600; padding:0 6px; border-radius:4px; border:1px solid var(--line); color:var(--muted); }
@keyframes blink { 50% { opacity:.25; } }
@keyframes pulse { 0% { stroke-opacity:1; } 50% { stroke-opacity:.25; } 100% { stroke-opacity:1; } }

/* cartes génériques */
.card { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
.metrics { display:grid; grid-template-columns:repeat(auto-fit, minmax(130px, 1fr)); gap:8px; }
.metric { background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:9px 12px; }
.metric small { color:var(--muted); font-size:11.5px; display:block; }
.metric b { font-size:19px; font-variant-numeric:tabular-nums; letter-spacing:-.01em; }
.metric b em { font-style:normal; font-size:12px; color:var(--muted); font-weight:500; }
.bar { height:5px; border-radius:3px; background:var(--panel); overflow:hidden; display:flex; }
.bar i { display:block; height:100%; background:var(--ok); }
.bar i.agent { background:var(--dancer); } .bar i.script { background:var(--script); } .bar i.over { background:var(--warn); }
table.list { width:100%; border-collapse:collapse; background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
table.list th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:600; padding:8px 12px; background:var(--panel); }
table.list td { padding:9px 12px; border-top:1px solid var(--line); vertical-align:middle; }
table.list tr[data-href] { cursor:pointer; } table.list tr[data-href]:hover td { background:var(--panel); }
.callout { padding:10px 14px; border-radius:10px; background:var(--warn-bg); color:var(--fg); border:1px solid color-mix(in srgb, var(--warn) 35%, transparent); }
.callout b:first-child { color:var(--warn); }
.callout.info { background:color-mix(in srgb, var(--run) 9%, var(--surface)); border-color:color-mix(in srgb, var(--run) 30%, transparent); }
.callout.info b:first-child { color:var(--run); }
.tabs { display:inline-flex; background:var(--panel); border-radius:8px; padding:2px; text-transform:none; letter-spacing:0; }
.tabs button { border:0; background:none; padding:3px 10px; border-radius:6px; font-size:12px; color:var(--muted); }
.tabs button[aria-pressed="true"] { background:var(--surface); color:var(--fg); box-shadow:0 1px 2px rgba(0,0,0,.08); }

/* le fil (v1) */
ol.thread { list-style:none; margin:0; padding:0; position:relative; }
ol.thread::before { content:""; position:absolute; left:15px; top:6px; bottom:6px; width:2px; background:var(--line); }
.ev { position:relative; display:grid; grid-template-columns:32px minmax(0, 1fr); gap:12px; padding:5px 0; }
.avatar { width:32px; height:32px; border-radius:50%; display:grid; place-items:center; font-size:12px; font-weight:700; color:#fff; background:var(--r); z-index:1; border:3px solid var(--bg); }
.bubble { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:8px 12px; min-width:0; position:relative; }
.ev.handoff .bubble { background:transparent; border-style:dashed; }
.bubble > time, .lbody > time { position:absolute; right:12px; top:8px; color:var(--faint); font-size:12px; font-variant-numeric:tabular-nums; }
.lbody { position:relative; padding:5px 50px 0 0; font-size:13px; color:var(--muted); }
.lbody > time { right:0; top:5px; }
.lbody b { color:var(--fg); }
.meta { display:flex; flex-wrap:wrap; align-items:center; gap:6px; font-size:13px; padding-right:44px; }
.tick { width:32px; display:flex; justify-content:center; padding-top:10px; z-index:1; }
.tick i { width:10px; height:10px; border-radius:50%; background:var(--bg); border:2px solid var(--faint); }
.ev.ok .tick i { background:var(--ok); border-color:var(--ok); } .ev.bad .tick i { background:var(--bad); border-color:var(--bad); }
.ev.warn .tick i { background:var(--warn); border-color:var(--warn); } .ev.warn .lbody, .ev.warn .lbody b { color:var(--warn); }
.ev.run .tick i { border-color:var(--run); } .ev.quiet { opacity:.75; }
.ev.bad .lbody b { color:var(--bad); }
.steps { margin:2px 0 0; padding:0; list-style:none; font-size:12px; }
.steps li::before { content:"· "; color:var(--faint); }
pre.text { white-space:pre-wrap; word-break:break-word; margin:6px 0 0; padding:8px 10px; border-radius:8px; background:var(--panel); font-size:12px; line-height:1.5; }
.sep-day { display:flex; align-items:center; gap:10px; margin:12px 0 4px 44px; font-size:11px; color:var(--faint); text-transform:uppercase; letter-spacing:.06em; }
.sep-day::after { content:""; flex:1; height:1px; background:var(--line); }

  /* La Scène : Dashboard, en scène, programme, Workshops, Rehearsals (sessions de Conductor), tickets, Premieres ;
     transitions et communication en Mermaid. Données : /api/stage, lues dans ~/.ballet/ballet.db. */
  .top { height:52px; display:flex; align-items:center; gap:12px; padding:0 18px; border-bottom:1px solid var(--line); background:var(--surface); position:sticky; top:0; z-index:5; }
  .brand b { font-size:16px; } .brand span { color:var(--muted); margin-left:6px; }
  select.project { font:inherit; font-size:13px; padding:4px 8px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); }
  .top nav { display:flex; gap:2px; }
  .top nav a { padding:5px 9px; border-radius:7px; color:var(--muted); font-size:13px; white-space:nowrap; }
  .top nav a.on { background:var(--panel); color:var(--fg); font-weight:600; }
  .health { margin-left:auto; display:flex; align-items:center; gap:6px; font-size:12.5px; padding:3px 10px; border-radius:999px; background:var(--ok-bg); color:var(--ok); font-weight:600; }
  .health.warn { background:var(--warn-bg); color:var(--warn); }
  .clock { font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .layout { display:grid; grid-template-columns:320px minmax(0,1fr); height:calc(100vh - 52px); }
  aside { border-right:1px solid var(--line); background:var(--surface); overflow:auto; padding:12px; }
  .blk { --a:var(--run); border:1px solid var(--line); border-left:3px solid var(--a); border-radius:10px; padding:4px 6px; margin-bottom:12px; }
  .blk.dir { --a:var(--warn); } .blk.prog { --a:#a16207; } .blk.tix { --a:var(--ok); }
  .blk-head { display:flex; align-items:center; gap:8px; width:100%; padding:6px; border:0; background:none; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--a); text-align:left; }
  .blk-head::before { content:"▾"; font-size:13px; width:10px; transition:transform .12s; }
  .blk.folded .blk-head::before { transform:rotate(-90deg); } .blk.folded .blk-body { display:none; }
  .blk-head .count { margin-left:auto; background:color-mix(in srgb, var(--a) 14%, transparent); padding:0 7px; border-radius:999px; }
  .blk-body { padding-bottom:4px; }
  .blk-foot { display:block; font-size:12px; color:var(--focus); padding:4px 8px 2px; }
  .item { display:block; padding:7px 9px; border-radius:8px; border:1px solid transparent; }
  .item:hover { background:var(--panel); }
  .item.picked { background:color-mix(in srgb, var(--a) 10%, var(--surface)); border-color:color-mix(in srgb, var(--a) 40%, transparent); }
  .item .row { display:flex; align-items:center; gap:6px; font-size:13px; } .item .row .end { margin-left:auto; }
  .item .t { font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .item .s { font-size:11.5px; color:var(--muted); display:flex; gap:6px; align-items:center; margin-top:2px; }
  .proj { font-size:10.5px; font-weight:700; color:var(--muted); border:1px solid var(--line); border-radius:4px; padding:0 5px; }
  .sim { font-size:10px; font-weight:700; color:#a16207; border:1px dashed #a16207; border-radius:4px; padding:0 4px; }
  .legacy { font-size:10px; color:var(--muted); border:1px dotted var(--faint); border-radius:4px; padding:0 4px; }
  main { overflow:auto; padding:22px clamp(16px, 3vw, 40px) 60px; }
  .wrap { max-width:1100px; margin:0 auto; display:grid; gap:20px; }
  .crumbs { font-size:12.5px; color:var(--muted); display:flex; gap:6px; flex-wrap:wrap; align-items:center; } .crumbs a:hover { color:var(--fg); }
  .hero-line { display:flex; flex-wrap:wrap; align-items:center; gap:10px; color:var(--muted); font-size:13px; }
  .more { font-size:12.5px; color:var(--focus); }
  /* runner : robot pour un agent, engrenage pour le script, silhouette pour le Director */
  .rn { display:inline-grid; place-items:center; width:22px; height:22px; border-radius:50%; font-size:11px; flex:none; color:var(--r); background:color-mix(in srgb, var(--r) 15%, transparent); }
  .rn.script { --r:var(--script); border-radius:5px; } .rn.human { --r:var(--director); }
  .outc { font-size:11px; font-weight:700; padding:0 7px; border-radius:999px; white-space:nowrap; }
  .outc.ok { color:var(--ok); background:var(--ok-bg); } .outc.failed { color:var(--bad); background:var(--bad-bg); } .outc.escalated, .outc.stopped, .outc.timeout { color:var(--warn); background:var(--warn-bg); }
  .outc.running { color:var(--run); background:color-mix(in srgb, var(--run) 14%, transparent); }
  .elapsed { font-variant-numeric:tabular-nums; }
  /* En scène */
  .now-grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fit, minmax(400px, 1fr)); }
  .now-card { display:grid; gap:10px; } .now-card:hover { border-color:var(--faint); } .now-card.esc { border-color:color-mix(in srgb, var(--warn) 50%, var(--line)); }
  .now-big { display:flex; gap:10px; align-items:center; font-size:16px; } .now-big .elapsed { margin-left:auto; font-size:20px; font-weight:700; }
  .lanes { background:var(--panel); border-radius:8px; padding:4px 8px; }
  .lrow { display:grid; grid-template-columns:100px minmax(0,1fr); align-items:center; height:20px; font-size:12px; }
  .lane { position:relative; height:100%; } .lane::before { content:""; position:absolute; left:0; right:0; top:50%; border-top:1px solid var(--line); }
  .seg { position:absolute; top:4px; height:12px; border-radius:3px; min-width:2px; background:var(--r); }
  .seg.script { background:var(--script); opacity:.6; border-radius:1px; } .seg.human { background:repeating-linear-gradient(45deg, var(--director) 0 3px, transparent 3px 6px); border:1px solid var(--director); }
  .seg.open { animation:blink 1.4s infinite; }
  /* gantt (ticket) */
  .gantt { display:grid; gap:4px; }
  .gantt .g { display:grid; grid-template-columns:170px minmax(0,1fr) 130px; gap:10px; align-items:center; font-size:12.5px; }
  .gantt .track { position:relative; height:16px; background:var(--panel); border-radius:4px; }
  .gantt .track i { position:absolute; top:2px; bottom:2px; border-radius:3px; background:var(--ok); min-width:2px; } .gantt .track i.plan { background:var(--choreographer); } .gantt .track i.ws { background:var(--dramaturg); } .gantt .track i.open { background:var(--run); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { display:inline-flex; gap:6px; align-items:center; padding:3px 9px; border:1px solid var(--line); border-radius:999px; font-size:12px; background:var(--surface); }
  .chip:hover { border-color:var(--faint); } .chip.on { border-color:var(--run); box-shadow:0 0 0 1px var(--run) inset; }
  /* diagrammes */
  .diagrams { display:grid; gap:14px; }
  .diag { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px; overflow:auto; }
  .diag .mermaid { display:flex; justify-content:center; } .diag svg { max-width:100%; height:auto; }
  .diag-note { font-size:12px; color:var(--muted); margin-top:4px; }
  /* le fil */
  .ev .avatar { background:color-mix(in srgb, var(--r) 18%, var(--bg)); color:var(--r); font-size:13px; }
  .ev .avatar.script { border-radius:8px; }
  /* dashboard */
  .health-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:10px; }
  .hcard { display:grid; gap:4px; } .hcard .st { display:flex; align-items:center; gap:8px; font-weight:600; }
  .hcard .st i.dot { width:9px; height:9px; border-radius:50%; background:var(--ok); } .hcard .st i.dot.warn { background:var(--warn); } .hcard .st i.dot.bad { background:var(--bad); }
  .hcard small { color:var(--muted); font-size:12px; } .hcard code { font-size:11px; color:var(--faint); }
  .bars { display:flex; align-items:flex-end; gap:4px; height:60px; } .bars i { flex:1; background:var(--ok); border-radius:3px 3px 0 0; min-height:2px; position:relative; }
  .bars-x { display:flex; gap:4px; font-size:10.5px; color:var(--faint); } .bars-x span { flex:1; text-align:center; }
  .theme { border:1px solid var(--line); background:var(--surface); border-radius:8px; width:30px; height:28px; color:var(--muted); }
  .acts { display:flex; gap:6px; justify-content:flex-end; }
  .btn { display:inline-flex; align-items:center; gap:5px; border:1px solid var(--line); background:var(--surface); border-radius:7px; padding:3px 10px; font-size:12px; white-space:nowrap; }
  .btn:hover { border-color:var(--faint); } .btn.primary { background:var(--fg); color:var(--bg); border-color:var(--fg); }
  .pager { display:flex; justify-content:flex-end; align-items:center; gap:8px; font-size:12.5px; color:var(--muted); margin-bottom:6px; font-variant-numeric:tabular-nums; }
  .pager button { border:1px solid var(--line); background:var(--surface); border-radius:6px; width:26px; height:24px; }
  .pager button:disabled { opacity:.35; cursor:default; }
  .split { display:flex; height:10px; border-radius:5px; overflow:hidden; } .split i { display:block; height:100%; }
  /* palette des rôles validée (clair puis sombre) */
  :root { --dramaturg:#9333ea; --choreographer:#0d9488; --dancer:#2563eb; --critic:#ea580c; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --dramaturg:#a855f7; --choreographer:#0d9488; --dancer:#3b82f6; --critic:#ea580c; } }
  :root[data-theme="dark"] { --dramaturg:#a855f7; --choreographer:#0d9488; --dancer:#3b82f6; --critic:#ea580c; }
  /* dashboard v2 */
  .hstrip { display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:8px; }
  .hmini { background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:7px 10px; display:grid; gap:1px; font-size:12px; }
  .hmini .st { display:flex; align-items:center; gap:7px; font-weight:600; font-size:13px; }
  .hmini i.dot { width:8px; height:8px; border-radius:50%; background:var(--ok); } .hmini i.dot.warn { background:var(--warn); } .hmini i.dot.bad { background:var(--bad); }
  .hmini small { color:var(--muted); }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:8px; }
  .kpi { background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px 12px; display:grid; gap:2px; }
  .kpi small { color:var(--muted); font-size:11.5px; } .kpi b { font-size:22px; font-variant-numeric:tabular-nums; letter-spacing:-.01em; }
  .kpi em { font-style:normal; font-size:11.5px; color:var(--muted); }
  .kpi svg { width:100%; height:28px; display:block; } .kpi .spark { fill:none; stroke:var(--run); stroke-width:1.6; } .kpi .spark-area { fill:color-mix(in srgb, var(--run) 12%, transparent); }
  .dgrid { display:grid; grid-template-columns:repeat(auto-fit, minmax(440px, 1fr)); gap:14px; }
  .card h3 em { font-style:normal; text-transform:none; letter-spacing:0; font-weight:400; }
  .heat { display:grid; grid-template-columns:46px repeat(24, minmax(0,1fr)); gap:2px; font-size:10.5px; color:var(--faint); }
  .heat i { aspect-ratio:1.6; border-radius:2px; background:var(--panel); max-height:22px; }
  .heat i[data-n] { background:color-mix(in srgb, var(--run) var(--v), var(--panel)); }
  .heat span { align-self:center; white-space:nowrap; }
  .stack { display:grid; grid-template-columns:170px minmax(0,1fr) 64px; gap:10px; align-items:center; font-size:12.5px; margin:4px 0; }
  .stack .segs { display:flex; gap:2px; height:16px; } .stack .segs i { display:block; height:100%; border-radius:2px; min-width:2px; }
  .k-agent { background:var(--dancer); } .k-script { background:var(--faint); } .k-human { background:var(--director); }
  .lgd { display:flex; gap:14px; font-size:11.5px; color:var(--muted); margin-top:8px; } .lgd span { display:inline-flex; gap:6px; align-items:center; } .lgd i { width:10px; height:10px; border-radius:2px; display:inline-block; }
  svg.chart { width:100%; height:auto; display:block; font-size:10.5px; } svg.chart text { fill:var(--faint); } svg.chart .grid { stroke:var(--line); }
  svg.chart .pt { fill:var(--run); fill-opacity:.7; } svg.chart .pt.open { fill:none; stroke:var(--run); } svg.chart .med { stroke:var(--warn); stroke-dasharray:5 4; stroke-width:1.5; }
  .diffs .stack { grid-template-columns:96px minmax(0,1fr) 46px; } .diffs .track { position:relative; height:14px; background:var(--panel); border-radius:3px; }
  .diffs .track i { position:absolute; left:0; top:0; bottom:0; border-radius:3px; background:var(--ok); } .diffs .track i.over { background:var(--warn); }
  .diffs .track b { position:absolute; top:-3px; bottom:-3px; width:0; border-left:2px dashed var(--bad); }
  .stack > span:first-child, .dgrid td { white-space:nowrap; }
  .rolebar { height:8px; border-radius:2px; background:var(--r); }
  .tip { position:fixed; pointer-events:none; z-index:60; background:var(--fg); color:var(--bg); font-size:12px; line-height:1.4; padding:5px 9px; border-radius:6px; max-width:520px; white-space:pre-line; box-shadow:0 4px 14px rgba(0,0,0,.2); display:none; }
  .offline { position:fixed; left:50%; transform:translateX(-50%); bottom:14px; z-index:40; padding:6px 12px; border-radius:8px; background:var(--bad-bg); color:var(--bad); font-size:12.5px; font-weight:600; }
  dialog.acc { border:1px solid var(--line); border-radius:12px; background:var(--surface); color:var(--fg); padding:18px 20px; max-width:440px; }
  dialog.acc::backdrop { background:rgba(0,0,0,.35); } dialog.acc h2 { font-size:16px; margin-bottom:8px; } dialog.acc p { font-size:13px; margin:0 0 14px; }
  /* durée en grand, coût, frictions, détail d'une étape du script */
  .bigs { display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:10px; }
  .big { display:grid; gap:2px; } .big small { color:var(--muted); font-size:12px; display:flex; align-items:center; gap:6px; }
  .big b { font-size:34px; font-weight:700; letter-spacing:-.02em; font-variant-numeric:tabular-nums; line-height:1.15; }
  .big.live b { color:var(--run); } .big em { font-style:normal; font-size:12.5px; color:var(--muted); }
  .big.live small::before { content:""; width:7px; height:7px; border-radius:50%; background:var(--run); animation:blink 1.4s infinite; }
  table.costs td.num, table.costs th.num { text-align:right; }
  .fr { list-style:none; margin:0; padding:0; display:grid; gap:6px; font-size:13px; }
  .fr li { display:grid; grid-template-columns:22px minmax(0,1fr); gap:6px; align-items:start; }
  .fr li i { color:var(--warn); padding-top:3px; }
  .ev.open-able > .lbody { cursor:pointer; } .ev.open-able > .lbody:hover > b { text-decoration:underline; }
  .ev.open-able > .lbody > b:first-child::after { content:" \25B8"; color:var(--faint); font-weight:400; } .ev.opened > .lbody > b:first-child::after { content:" \25BE"; }
  .det { margin-top:6px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--fg); font-size:12.5px; cursor:default; }
  .det table { border-collapse:collapse; width:100%; } .det td { padding:2px 8px 2px 0; vertical-align:top; word-break:break-word; } .det td:first-child { color:var(--muted); white-space:nowrap; width:1%; }
  .det pre.text { max-height:360px; overflow:auto; }
  @media (max-width:900px) { .layout { grid-template-columns:1fr; height:auto; } aside { max-height:40vh; } .top nav { display:none; } }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>Ballet</b><span>Scène</span></div>
  <select class="project" id="project" aria-label="Projet"></select>
  <nav id="nav"></nav>
  <a class="health" id="health" href="#/dashboard"></a>
  <button class="theme" id="theme" title="Thème"></button>
  <span class="clock" id="clock"></span>
</header>
<div class="layout"><aside id="side"></aside><main><div class="wrap" id="page"></div></main></div>
<div class="tip" id="tip"></div>
<div class="offline" id="offline" hidden></div>
<script src="/vendor/mermaid.min.js"></script>
<script>
/* --- outils --------------------------------------------------------------------------------- */
let STAGE = null, PLAYS = {}, version = '';
const now = () => Date.now();
const ROLE = {dramaturg:'Dramaturg', choreographer:'Choreographer', dancer:'Dancer', critic:'Critic', conductor:'Conductor', director:'Director', maestro:'Maestro', monitor:'Monitor'};
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;'}[c]));
const clock = at => new Date(at).toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
const dayOf = at => new Date(at).toLocaleDateString('fr-FR', {weekday:'short', day:'numeric', month:'short'});
const secs = (a, b) => Math.max(0, Math.round(((b ? +new Date(b) : now()) - +new Date(a)) / 1000));
const dur = s => s < 60 ? `${s} s` : s < 3600 ? `${Math.floor(s / 60)} min${s < 600 ? ' ' + String(s % 60).padStart(2, '0') : ''}` : s < 172800 ? `${Math.floor(s / 3600)} h ${String(Math.floor(s % 3600 / 60)).padStart(2, '0')}` : `${Math.round(s / 86400)} j`;
const ago = at => `il y a ${dur(secs(at))}`;
const median = xs => { const s = [...xs].sort((a, b) => a - b); return s.length ? s[Math.floor(s.length / 2)] : 0; };
const role = who => `<span class="role r-${esc(who)}">${esc(ROLE[who] || who)}</span>`;
const ICON = {agent:'fa-robot', script:'fa-gear', human:'fa-user'};
/* Chaque étape déterministe a son icône : la preuve, la mutation, la politique, la taille du diff. */
const STEP_ICON = {proof:'fa-flask-vial', mutation:'fa-dna', policy:'fa-scale-balanced', size:'fa-ruler-combined'};
const iconOfNode = n => STEP_ICON[n.kind] || ICON[n.runner];
const tok = n => n >= 1e6 ? `${(n / 1e6).toFixed(1).replace('.', ',')} M` : n >= 1e3 ? `${Math.round(n / 1e3)} k` : String(n);
const usd = x => `$${x.toFixed(2)}`;
const runnerOf = who => who === 'director' ? 'human' : ['conductor', 'script'].includes(who) ? 'script' : 'agent';
const rn = (runner, who = '', icon = '') => `<span class="rn ${runner}" style="${runner === 'agent' ? `--r:var(--${who})` : ''}"><i class="fa-solid ${icon || ICON[runner]}"></i></span>`;
const rnNode = n => rn(n.runner, nodeWho(n), iconOfNode(n));
const nodeWho = n => n.kind === 'turn' ? n.name : n.runner === 'human' ? 'director' : 'script';
const label = n => n.kind === 'turn' ? (ROLE[n.name] || n.name) : n.kind === 'proof' ? 'Preuve' : n.kind === 'mutation' ? `Mutation ${n.name}` : n.kind === 'director' ? 'Attente du Director' : n.name;
const outc = (o, ended = true) => ended ? `<span class="outc ${o}">${{ok:'ok', failed:'échec', escalated:'escaladé', stopped:'arrêté', timeout:'trop long'}[o] || o}</span>` : '<span class="outc running">en cours</span>';
const verdict = e => /REJECTED/.test(e.data.text || '') ? 'REJECTED' : /APPROVED/.test(e.data.text || '') ? 'APPROVED' : /ESCALATE/.test(e.data.text || '') ? 'ESCALATE' : '';

/* --- le modèle -------------------------------------------------------------------------------- */
let project = 'all', filter = 'all';
const stored = k => { try { return localStorage.getItem(k) || ''; } catch { return ''; } };
const store = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
let sceneMode = stored('stage-scene'), theme = stored('stage-theme') || 'auto';
const folds = new Set((() => { try { return (localStorage.getItem('stage-folds') || '').split(',').filter(Boolean); } catch { return []; } })());
const inProject = x => project === 'all' || x.project === project;
const plays = () => STAGE.plays.filter(inProject);
const nodesOf = p => PLAYS[p.node]?.nodes || [];
const openNode = p => nodesOf(p).filter(n => !n.ended_at).at(-1);
const running = () => plays().filter(p => !p.ended_at);
const premieres = () => plays().filter(p => p.ended_at && p.pr && p.kind === 'rehearsal').sort((a, b) => a.ended_at < b.ended_at ? 1 : -1);
const tickets = () => { const seen = new Set(); return plays().filter(p => p.kind === 'rehearsal' && !seen.has(p.key) && seen.add(p.key)); };
/* Les sessions de Conductor : une ligne par <projet>#<élément>, ses représentations dans l'ordre. */
function sessions(kind) {
  const by = new Map();
  for (const p of plays().filter(p => p.kind === kind)) { if (!by.has(p.session)) by.set(p.session, []); by.get(p.session).push(p); }
  return [...by].map(([key, ps]) => {
    const c = STAGE.conductors.find(x => x.id === key), last = ps.at(-1);
    return {key, project:ps[0].project, item:key.split('#')[1], plays:ps, conductor:c, mode:ps[0].mode, legacy:ps[0].legacy, simulated:ps.some(p => p.simulated),
      started_at:ps[0].started_at, ended_at:ps.every(p => p.ended_at) ? last.ended_at : null, state:c?.state || (ps.every(p => p.ended_at) ? 'finished' : 'running'),
      outcome:last.outcome, title:ps.find(p => !p.planning)?.title || last.title};
  }).sort((a, b) => a.started_at < b.started_at ? 1 : -1);
}
const sessionOf = p => sessions(p.kind).find(s => s.key === p.session);
/* Le coût de plusieurs représentations (un ticket : son Workshop, son plan, ses slices) : les rôles fusionnés, le total,
   et ce qui manque (un coût encore en calcul, un journal absent). */
function costOf(ps) {
  const roles = new Map(), out = {usd:0, tokens:0, cache_read:0, pending:0, missing:[], left_out:[], roles:[]};
  for (const p of ps) {
    const c = p.cost;
    if (!c) { out.pending++; continue; }
    if (c.missing) { out.missing.push(`${p.key} : ${c.missing}`); continue; }
    out.usd += c.usd; out.tokens += c.tokens; out.cache_read += c.cache_read; out.left_out.push(...c.left_out.map(x => `${p.key} : ${x}`));
    for (const r of c.roles) { const m = roles.get(r.role) || {role:r.role, models:new Set(), tokens:0, cache_read:0, output:0, usd:0};
      r.models.forEach(x => m.models.add(x)); m.tokens += r.tokens; m.cache_read += r.cache_read; m.output += r.output; m.usd += r.usd; roles.set(r.role, m); }
  }
  out.roles = [...roles.values()].map(r => ({...r, models:[...r.models]})).sort((a, b) => b.usd - a.usd);
  return out;
}
/* Le coût cumulé de plusieurs représentations (une session de Conductor, un ticket) : `…` tant qu'une se calcule. */
const costSum = ps => { const c = costOf(ps); return !c.roles.length ? (c.pending ? '<span class="faint">…</span>' : '<span class="faint">—</span>')
  : `<span ${tip(`${tok(c.tokens)} tokens, dont ${tok(c.cache_read)} lus en cache${c.pending ? ` · ${c.pending} encore en calcul` : ''}`)}>${usd(c.usd)}${c.pending ? '…' : ''}</span>`; };
/* Le coût d'un ticket : une ligne par représentation (Workshop, plan, slices), une colonne par session d'agent, le cumul en bas. */
function costMatrix(ps) {
  const total = costOf(ps), roles = total.roles.map(r => r.role);
  if (!roles.length) return costTable(total);
  const cell = (c, r) => { const x = c.roles.find(y => y.role === r); return x ? `<span ${tip(`${tok(x.tokens)} tokens · ${x.models.join(', ')}`)}>${usd(x.usd)}</span>` : '<span class="faint">—</span>'; };
  const name = p => p.kind === 'workshop' ? 'Workshop' : p.planning ? 'Plan' : esc(p.key);
  return `<table class="list costs"><tr><th>Représentation</th>${roles.map(r => `<th class="num">${role(r.toLowerCase())}</th>`).join('')}<th class="num">Tokens</th><th class="num">Total</th></tr>
    ${ps.map(p => { const c = costOf([p]); return `<tr data-href="#/play/${p.node}"><td><b>${name(p)}</b>${p.ended_at ? '' : ' ' + outc('', false)}</td>${c.roles.length ? roles.map(r => `<td class="num">${cell(c, r)}</td>`).join('') + `<td class="num muted">${tok(c.tokens)}</td><td class="num"><b>${usd(c.usd)}</b></td>`
      : `<td colspan="${roles.length + 2}" class="faint">${c.pending ? 'en calcul…' : esc(c.missing.join(' · '))}</td>`}</tr>`; }).join('')}
    <tr><td><b>Cumul</b></td>${roles.map(r => `<td class="num"><b>${cell(total, r)}</b></td>`).join('')}<td class="num"><b>${tok(total.tokens)}</b></td><td class="num"><b>${usd(total.usd)}</b></td></tr></table>${costNotes([...total.left_out, ...total.missing])}
    <div class="diag-note">Gardé à la fin de chaque représentation (<code>frictions.cost</code>), sinon lu dans les journaux de Claude Code. Le dollar est l'équivalent au prix de l'API ; les tokens, la mesure du quota.</div>`;
}
const costCell = p => !p.cost ? '<span class="faint">…</span>' : p.cost.missing ? `<span class="faint" ${tip(p.cost.missing)}>—</span>` : `<span ${tip(`${tok(p.cost.tokens)} tokens, dont ${tok(p.cost.cache_read)} lus en cache`)}>${usd(p.cost.usd)}</span>`;
/* Durée en grand : un minuteur vivant tant que ça joue. */
function bigDuration(start, end, what, played = 'jouée') {
  const live = !end;
  return `<div class="card big ${live ? 'live' : ''}"><small><i class="fa-solid fa-stopwatch"></i>${live ? `${what} en cours depuis` : `${what} ${played} en`}</small>
    <b ${live ? `class="elapsed" data-since="${start}"` : ''}>${dur(secs(start, end))}</b><em>${dayOf(start)} ${clock(start)}${end ? ` → ${dayOf(end) === dayOf(start) ? '' : dayOf(end) + ' '}${clock(end)}` : ' → maintenant'}</em></div>`;
}
function bigCost(c, count) {
  const sure = !c.pending && !c.missing.length;
  return `<div class="card big"><small><i class="fa-solid fa-coins"></i>Coût${count > 1 ? ` · ${count} représentations` : ''} · équivalent au prix de l'API</small>
    <b>${c.roles.length ? usd(c.usd) : c.pending ? '…' : '—'}</b><em>${tok(c.tokens)} tokens, dont ${tok(c.cache_read)} lus en cache${c.pending ? ` · ${c.pending} en calcul` : ''}${!sure && c.missing.length ? ` · ${c.missing.length} sans journal` : ''}</em></div>`;
}
/* Ce que le coût ne compte pas (un Conductor introuvable, un modèle sans prix) : en entier jusqu'à 3, résumé au-delà. */
const costNotes = notes => !notes.length ? '' : notes.length <= 3 ? `<div class="diag-note">${notes.map(esc).join('<br>')}</div>`
  : `<div class="diag-note" ${tip(notes.join('\n'))}><i class="fa-solid fa-circle-info"></i> ${notes.length} parts du coût non comptées (un Conductor introuvable, un modèle sans prix…) · survoler pour le détail</div>`;
function costTable(c) {
  if (!c.roles.length) return `<p class="muted">${c.pending ? 'Coût en calcul : lu dans les journaux de Claude Code…' : 'Pas de coût : ' + esc(c.missing.join(' · ') || 'aucun journal')}</p>`;
  return `<table class="list costs"><tr><th>Session</th><th class="num">Tokens</th><th class="num">Lus en cache</th><th class="num">Sortie</th><th class="num">$</th></tr>
    ${c.roles.map(r => `<tr><td>${role(r.role.toLowerCase())}<div class="faint mono" style="font-size:11px">${esc(r.models.join(', '))}</div></td><td class="num">${tok(r.tokens)}</td><td class="num muted">${tok(r.cache_read)}</td><td class="num muted">${tok(r.output)}</td><td class="num"><b>${usd(r.usd)}</b></td></tr>`).join('')}
    <tr><td><b>Total</b></td><td class="num"><b>${tok(c.tokens)}</b></td><td class="num muted">${tok(c.cache_read)}</td><td></td><td class="num"><b>${usd(c.usd)}</b></td></tr></table>
    ${costNotes([...c.left_out, ...c.missing])}
    <div class="diag-note">Lu dans les journaux de Claude Code (<code>~/.claude/projects</code>), sur la fenêtre de la représentation. Le Director est sur un abonnement : le dollar est l'équivalent au prix de l'API, les tokens sont la mesure du quota.</div>`;
}
const FRICTION_ICON = {escalation:'fa-triangle-exclamation', rejections:'fa-rotate-left', red_proofs:'fa-flask-vial', red_mutations:'fa-dna', refused_reports:'fa-ban', nudges:'fa-bell', idle:'fa-hourglass-half', policy:'fa-scale-balanced', diff:'fa-ruler-combined'};
/* Les genres de frictions de plusieurs représentations, comptés : `escalation ×5 · policy ×2 · diff`. */
const frictionKinds = ps => { const n = {}; ps.forEach(p => p.frictions.list.forEach(f => n[f.kind] = (n[f.kind] || 0) + 1));
  return Object.entries(n).sort((a, b) => b[1] - a[1]).map(([k, c]) => c > 1 ? `${k} ×${c}` : k).join(' · '); };
const frictionList = list => list.length ? `<ul class="fr">${list.map(f => `<li><i class="fa-solid ${FRICTION_ICON[f.kind] || 'fa-circle-exclamation'}"></i><span>${esc(f.text)}</span></li>`).join('')}</ul>` : '<p class="muted" style="margin:0">Aucune friction.</p>';
/* Le retour de la représentation : ce que le script a dit à sa fin (le `done`), et ses frictions. */
function feedback(p) {
  const done = (PLAYS[p.node]?.marks || []).filter(e => ['done', 'handover', 'published', 'stopped'].includes(e.kind)).at(-1);
  return `<div class="card"><h3><i class="fa-solid fa-triangle-exclamation"></i> Frictions <em>· ${p.frictions.live ? 'calculées sur le moment' : 'gardées à la fin'}</em><span class="badge ${p.frictions.list.length ? 'warn' : 'ok'}" style="margin-left:auto">${p.frictions.list.length}</span></h3>${frictionList(p.frictions.list)}
    ${done ? `<h3 style="margin-top:14px"><i class="fa-solid fa-flag-checkered"></i> Retour du script <em>· ${clock(done.at)}</em></h3><div style="font-size:13px">${esc(done.data.reason || done.kind)}</div>${(done.data.done || []).length ? `<ul class="steps">${done.data.done.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}` : ''}</div>`;
}

/* --- la sidebar (blocs pliables) --------------------------------------------------------------- */
function block(key, cls, title, count, body, foot = '') {
  return `<div class="blk ${cls} ${folds.has(key) ? 'folded' : ''}"><button class="blk-head" data-fold="${key}">${title}<span class="count">${count}</span></button><div class="blk-body">${body}${foot}</div></div>`;
}
function side(rt) {
  const picked = id => rt.id === id ? 'picked' : '';
  const live = running().map(p => { const n = openNode(p);
    return `<a class="item ${picked(p.node)}" href="#/play/${p.node}"><div class="row"><span class="proj">${p.project}</span><b>${esc(p.key)}</b>${p.simulated ? '<span class="sim">simulé</span>' : ''}<span class="end muted" style="font-size:11.5px">${p.mode}</span></div>
      <div class="t">${esc(p.title)}</div>${n ? `<div class="s">${rnNode(n)}<span>${esc(label(n))}</span><span class="elapsed" data-since="${n.started_at}">${dur(secs(n.started_at))}</span></div>` : ''}</a>`; }).join('');
  const waits = running().filter(p => openNode(p)?.runner === 'human').map(p => `<a class="item" href="#/play/${p.node}"><div class="row"><span class="proj">${p.project}</span><b>${esc(p.key)}</b><span class="badge warn end">escalade</span></div><div class="t">${esc(openNode(p).events[0]?.data.reason)}</div></a>`).join('')
    + STAGE.proposed.filter(inProject).map(x => `<div class="item"><div class="row"><span class="proj">${x.project}</span><b>${x.item}</b><span class="badge warn end">proposed</span></div><div class="t">${esc(x.title)}</div><div class="s">${x.decided_alone} décisions prises seul</div><div class="acts" style="justify-content:flex-start;margin-top:5px">${acceptActs(x)}</div></div>`).join('');
  const ready = STAGE.ready.filter(inProject).map((x, i) => `<a class="item" href="#/program"><div class="row"><span class="faint num">${i + 1}</span><span class="proj">${x.project}</span><b>${x.item}</b><span class="kind end">${x.type} · ${x.priority}</span></div><div class="t">${esc(x.title)}</div>${x.blocked_by.length ? `<div class="s"><i class="fa-solid fa-link"></i> bloqué par ${x.blocked_by.join(', ')}</div>` : ''}</a>`).join('');
  const done = tickets().filter(p => p.ended_at && p.type !== 'Slice').reverse();
  const tix = done.slice(0, 8).map(p => `<a class="item ${picked(p.key)}" href="${p.type === 'Feature' ? '#/ticket/' + p.key : '#/play/' + p.node}"><div class="row"><span class="proj">${p.project}</span><b>${esc(p.key)}</b><span class="kind end">${p.type}</span></div><div class="t">${esc(p.title)}</div><div class="s">${dayOf(p.ended_at)}${slicesOf(p.key).length ? ` · ${slicesOf(p.key).length} slices` : ''}</div></a>`).join('');
  return block('scene', '', 'En scène', running().length, live || '<p class="muted" style="margin:4px 8px">Rien ne joue.</p>')
    + block('dir', 'dir', 'Director attendu', (waits.match(/class="item/g) || []).length, waits || '<p class="muted" style="margin:4px 8px">Rien.</p>')
    + block('prog', 'prog', 'Programme', STAGE.ready.filter(inProject).length, ready, '<a class="blk-foot" href="#/program">Tout le programme →</a>')
    + block('tix', 'tix', 'Tickets traités', done.length, tix, '<a class="blk-foot" href="#/tickets">Tous les tickets, slices comprises →</a>');
}
const slicesOf = key => plays().filter(p => p.parent === key);

/* --- les pages ----------------------------------------------------------------------------------- */
const PAGES = {
  scene() {
    /* Plusieurs représentations : celles qui attendent le Director d'abord, puis la plus ancienne ; en cartes jusqu'à 4,
       en liste au-delà (ou au choix). */
    const live = running().map(p => ({p, n:openNode(p)})).sort((a, b) => (b.n?.runner === 'human') - (a.n?.runner === 'human') || (a.p.started_at < b.p.started_at ? -1 : 1));
    const mode = sceneMode || (live.length > 4 ? 'list' : 'cards');
    const card = ({p, n}) => { const s = sessionOf(p), human = n?.runner === 'human';
      return `<a class="card now-card ${human ? 'esc' : ''}" href="#/play/${p.node}">

      : ['  classDef agent fill:#eef2ff,stroke:#6366f1,color:#1e1b4b', '  classDef script fill:#f4f4f5,stroke:#a1a1aa,color:#27272a,stroke-dasharray:4 3', '  classDef human fill:#fff1f2,stroke:#e11d48,color:#881337', '  classDef now stroke:#4f46e5,stroke-width:4px']),

    const d = e.data;
    if (e.kind === 'handoff') { who.add(d.role); lines.push(`  ${name('conductor')}->>${name(d.role)}: ${d.how === 'start' ? 'lance' : 'relance'}${d.model ? ' (' + d.model + ')' : ''}`); }
    else if (e.kind === 'message' && d.from && d.to) { who.add(d.from); who.add(d.to); const v = d.type === 'verdict' ? verdict(e) : ''; lines.push(`  ${name(d.from)}-->>${name(d.to)}: ${d.type}${v ? ' ' + v : ''}${d.round ? ' · tour ' + d.round : ''}`); }
    else if (e.kind === 'escalate') { who.add('director'); lines.push(`  ${name('conductor')}-)${name('director')}: escalade`); }
    else if (e.kind === 'director-decision') { who.add('director'); lines.push(`  ${name('director')}-)${name('conductor')}: décide`); }
  }
  const order = ['director', 'conductor', 'dramaturg', 'choreographer', 'dancer', 'critic'].filter(r => who.has(r));
  return [lines[0], ...order.map(r => `  participant ${name(r)}`), ...lines.slice(1)].join('\n');
}

/* --- Le fil, comme la v1 : un robot pour un agent, un engrenage pour le script, une silhouette pour le Director. --- */
function thread(p) {
  const evs = [...nodesOf(p).flatMap(n => n.events.map(e => ({...e, node:n}))), ...PLAYS[p.node].marks].sort((a, b) => a.id - b.id);
  const TALK = new Set(['message', 'handoff', 'escalate', 'director-decision', 'published']);
  const rows = evs.filter(e => filter === 'all' || (filter === 'talk') === TALK.has(e.kind));
  const pg = paged(`thread-${p.node}-${filter}`, rows, 25);
  return `${pg.nav}<ol class="thread">${pg.rows.map(row).join('')}</ol>${pg.nav}`;
}
/* L'étape du script de chaque événement, pour son icône. */
const STEP_OF = {'proof-start':'proof', 'proof-end':'proof', 'proof-reused':'proof', 'proof-waiting':'proof', 'mutation-start':'mutation', 'mutation-end':'mutation',
  'mutation-wake':'mutation', 'mutation-skipped':'mutation', 'mutation-inconclusive':'mutation', policy:'policy', 'diff-size':'size'};
const opened = new Set(), LOGS = {};
const LABEL = {passed:'verte', timed_out:'trop longue', head:'commit', seconds:'secondes', exit_code:'code de sortie', tool:'outil', command:'commande', role:'rôle',
  violations:'violations', reason:'motif', done:'étapes', counted:'lignes comptées', limit:'limite', excluded:'exclues', over:'au-dessus', log:'sortie', details:'détail', report:'rapport'};
function stepDetail(e) {
  const d = {...e.data}, rows = [];
  if (e.node) rows.push(['étape', `${esc(label(e.node))}${e.node.ended_at ? ` · ${dur(secs(e.node.started_at, e.node.ended_at))}` : ' · en cours'}`]);
  for (const [k, v] of Object.entries(d)) {
    if (k === 'report' && v && typeof v === 'object') { rows.push(['rapport', `${v.killed} tués · ${v.survived} survivants · ${v.invalid ?? 0} non viables · ${v.timeouts ?? 0} trop longs · score ${v.score}`]);
      if ((v.survivors || []).length) rows.push(['survivants', `<ul class="steps">${v.survivors.map(x => `<li class="mono">${esc(typeof x === 'string' ? x : JSON.stringify(x))}</li>`).join('')}</ul>`]); continue; }
    const shown = Array.isArray(v) ? (v.length ? `<ul class="steps">${v.map(x => `<li>${esc(typeof x === 'string' ? x : JSON.stringify(x))}</li>`).join('')}</ul>` : '<span class="muted">aucune</span>')
      : typeof v === 'boolean' ? (v ? 'oui' : 'non') : v && typeof v === 'object' ? `<pre class="text">${esc(JSON.stringify(v, null, 2))}</pre>` : `<span class="${['head', 'log', 'details', 'command'].includes(k) ? 'mono' : ''}">${esc(v)}</span>`;
    rows.push([LABEL[k] || k, shown]);
  }
  const log = d.log ? (LOGS[d.log] === undefined ? `<button class="btn" data-log="${esc(d.log)}"><i class="fa-solid fa-terminal"></i> Voir la sortie</button>`
    : `<pre class="text">${esc(LOGS[d.log])}</pre>`) : '';
  return `<div class="det">${rows.length ? `<table>${rows.map(([k, v]) => `<tr><td>${esc(k)}</td><td>${v}</td></tr>`).join('')}</table>` : '<span class="muted">Pas de données.</span>'}${log}</div>`;
}
function row(e) {
  const d = e.data, t = `<time>${clock(e.at)}</time>`;
  const av = (who, icon = '') => { const r = runnerOf(who); return `<span class="avatar ${r}" style="--r:var(--${r === 'human' ? 'director' : r === 'script' ? 'script' : who})"><i class="fa-solid ${icon || ICON[r]}"></i></span>`; };
  const bubble = (who, meta, body = '', cls = '') => `<li class="ev ${cls}">${av(who)}<div class="bubble">${meta}${t}${body}</div></li>`;
  /* Une ligne du script s'ouvre au clic sur son détail : ses données, la sortie gardée (le journal d'une mutation). */
  const open = opened.has(e.id), icon = STEP_ICON[STEP_OF[e.kind]] || '';
  const line = (who, html, tone = '') => `<li class="ev line ${tone} open-able ${open ? 'opened' : ''}">${av(who, icon)}<div class="lbody" data-open="${e.id}">${html}${t}${open ? stepDetail(e) : ''}</div></li>`;
  const pre = x => x ? `<pre class="text">${esc(x.length > 500 ? x.slice(0, 500) + '…' : x)}</pre>` : '';
  switch (e.kind) {
    case 'message': { const v = d.type === 'verdict' ? verdict(e) : ''; return bubble(d.from, `<div class="meta">${role(d.from)} → ${role(d.to)} <span class="badge ${v === 'APPROVED' ? 'ok' : v === 'REJECTED' ? 'bad' : d.type === 'question' ? 'warn' : ''}">${esc(v || d.type)}</span><span class="muted">tour ${esc(d.round)}</span></div>`, pre(d.text)); }
    case 'handoff': return bubble('conductor', `<div class="meta">${role('conductor')} → ${rn('agent', d.role)} ${role(d.role)} <span class="badge">${d.how === 'start' ? 'lancé' : 'relancé'}</span>${d.model ? `<span class="muted">${esc(d.agent)} ${esc(d.model)}</span>` : ''}</div>`, '', 'handoff');
    case 'proof-start': return line('script', `<b>Preuve</b> lancée <span class="mono">${esc(e.node?.name || '')}</span>`);
    case 'proof-end': return line('script', `<b>Preuve</b> ${d.passed ? 'verte' : d.timed_out ? 'trop longue' : 'rouge'} · ${d.seconds} s`, d.passed ? 'ok' : 'bad');
    case 'mutation-start': return line('script', `<b>Mutation</b> ${esc(e.node?.name || '')} lancée en arrière-plan`);
    case 'mutation-end': return line('script', `<b>Mutation</b> ${esc(d.tool || '')} ${d.passed ? 'verte' : 'rouge'} · ${d.seconds} s${d.report ? ` · ${d.report.killed} tués, ${d.report.survived} survivants` : ''}`, d.passed ? 'ok' : 'bad');
    case 'mutation-skipped': return line('script', `<b>Mutation</b> sautée : ${esc(d.reason)}`, 'quiet');
    case 'mutation-inconclusive': return line('script', `<b>Mutation</b> sans conclusion${d.reason ? ' : ' + esc(d.reason) : ''}`, 'warn');
    case 'escalate': return line('director', `<b>Escalade</b> : ${esc(d.reason)}`, 'warn');
    case 'director': return line('director', '<b>Le Director a répondu</b>', 'ok');
    case 'director-decision': return line('director', `<b>Décision du Director</b>${d.verdict ? ' : ' + esc(d.verdict) : ''}`, 'ok');
    case 'policy': return line('script', `<b>Politique</b> · ${role(d.role)} ${d.violations?.length ? `: ${d.violations.length} violation(s)<ul class="steps">${d.violations.map(v => `<li>${esc(v)}</li>`).join('')}</ul>` : 'en règle'}`, d.violations?.length ? 'bad' : 'quiet');
    case 'diff-size': return line('script', `<b>Diff</b> ${d.counted} / ${d.limit} lignes${d.over ? ' · au-dessus' : ''}`, d.over ? 'warn' : 'quiet');
    case 'wait': return line('script', `<b>Script</b><ul class="steps">${(d.done || []).map(x => `<li>${esc(x)}</li>`).join('')}</ul>`, 'quiet');
    case 'begin': case 'rehearsal': return line('script', `<b>Ouverture</b>${d.item ? ' de ' + esc(d.item) : ''}`);
    case 'done': return line('script', `<b>Terminé</b> : ${esc(d.reason)}`, 'ok');
    case 'handover': return line('script', `<b>Passage de main</b> à ${esc(d.to)}`, 'ok');
    case 'published': return line('script', `<b>Issue #${d.issue} publiée</b> en ${esc(d.status)} · ${d.decided_alone} décisions prises seul`, 'ok');
    default: return line('script', `<b>${esc(e.kind)}</b>`, 'quiet');
  }
}

/* --- rendu ------------------------------------------------------------------------------------- */
const NAV = [['dashboard', 'Dashboard'], ['scene', 'En scène'], ['program', 'Programme'], ['workshops', 'Workshops'], ['rehearsals', 'Rehearsals'], ['tickets', 'Tickets'], ['premieres', 'Premieres'], ['frictions', 'Frictions']];
const route = () => { const [page = 'dashboard', id = ''] = location.hash.slice(2).split('/').map(decodeURIComponent); return {page, id}; };
/* Le thème : auto (celui du système), clair ou sombre ; Mermaid suit. */
const isDark = () => theme === 'dark' || (theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
const THEMES = {auto:['fa-circle-half-stroke', 'Thème : auto'], light:['fa-sun', 'Thème : clair'], dark:['fa-moon', 'Thème : sombre']};
function applyTheme() {
  if (theme === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = theme;
  const [icon, text] = THEMES[theme]; const b = document.getElementById('theme'); b.innerHTML = `<i class="fa-solid ${icon}"></i>`; b.title = text + ' (cliquer pour changer)';
  mermaid.initialize({startOnLoad:false, theme:isDark() ? 'dark' : 'neutral', securityLevel:'loose', flowchart:{curve:'basis', htmlLabels:true}, sequence:{mirrorActors:false, showSequenceNumbers:true}});
}
applyTheme();
async function render() {
  const rt = route();
  document.getElementById('project').innerHTML = [['all', 'Tous les projets'], ...STAGE.projects.map(p => [p.alias, p.alias])].map(([k, l]) => `<option value="${k}" ${project === k ? 'selected' : ''}>${l}</option>`).join('');
  document.getElementById('nav').innerHTML = NAV.map(([k, l]) => `<a href="#/${k}" class="${rt.page === k || (k === 'tickets' && rt.page === 'ticket') || (k === 'rehearsals' && rt.page === 'play') ? 'on' : ''}">${l}</a>`).join('');
  const H = STAGE.health, ok = !H.paused_at && !H.legacy_pending && !versionNotes().length && H.monitor.seen_at && secs(H.monitor.seen_at) < 3 * H.monitor.interval_s;
  const h = document.getElementById('health'); h.className = 'health' + (ok ? '' : ' warn'); h.innerHTML = `<i class="fa-solid fa-heart-pulse"></i>${ok ? 'Ballet OK' : 'Ballet à vérifier'}`;
  document.getElementById('side').innerHTML = side(rt);
  document.getElementById('page').innerHTML = (PAGES[rt.page] || PAGES.dashboard)(rt.id);
  const pending = document.querySelectorAll('.mermaid'); if (pending.length) await mermaid.run({nodes:pending});
}
function tick() {
  document.getElementById('clock').textContent = clock(new Date(now()).toISOString());
  document.querySelectorAll('[data-since]').forEach(el => el.textContent = dur(secs(el.dataset.since)));
}
document.addEventListener('click', e => {
  const fold = e.target.closest('[data-fold]');
  if (fold) { const k = fold.dataset.fold; folds.has(k) ? folds.delete(k) : folds.add(k); try { localStorage.setItem('stage-folds', [...folds].join(',')); } catch {} fold.parentElement.classList.toggle('folded'); return; }
  const f = e.target.closest('[data-filter]'); if (f) { filter = f.dataset.filter; render(); return; }
  if (e.target.closest('#theme')) { theme = {auto:'light', light:'dark', dark:'auto'}[theme]; store('stage-theme', theme); applyTheme(); render(); return; }
  const sc = e.target.closest('[data-scene]'); if (sc) { sceneMode = sc.dataset.scene; store('stage-scene', sceneMode); render(); return; }
  const lg = e.target.closest('[data-log]'); if (lg) { const path = lg.dataset.log; LOGS[path] = 'lecture…'; render();
    fetch('/api/log?path=' + encodeURIComponent(path)).then(r => r.ok ? r.text() : `Sortie introuvable (${r.status}).`).then(x => { LOGS[path] = x || '(vide)'; render(); }); return; }
  if (e.target.closest('.det')) return;
  const op = e.target.closest('[data-open]'); if (op && !e.target.closest('a')) { const id = +op.dataset.open; opened.has(id) ? opened.delete(id) : opened.add(id); render(); return; }
  const pg = e.target.closest('[data-page]'); if (pg) { const [k, n] = pg.dataset.page.split(':'); pages[k] = +n; render(); return; }
  if (e.target.closest('a')) return;
  const tr = e.target.closest('tr[data-href]'); if (tr) location.hash = tr.dataset.href;
});
/* L'infobulle : toute marque qui porte data-tip. */
const tipEl = document.getElementById('tip');
document.addEventListener('mousemove', e => {
  const m = e.target.closest?.('[data-tip]'); if (!m) { tipEl.style.display = 'none'; return; }
  tipEl.textContent = m.dataset.tip; tipEl.style.display = 'block';
  const r = tipEl.getBoundingClientRect(), x = Math.min(e.clientX + 12, innerWidth - r.width - 8), y = e.clientY + 16 + r.height > innerHeight ? e.clientY - r.height - 10 : e.clientY + 16;
  tipEl.style.left = x + 'px'; tipEl.style.top = y + 'px';
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (theme === 'auto') { applyTheme(); render(); } });
document.getElementById('project').addEventListener('change', e => { project = e.target.value; render(); });
addEventListener('hashchange', () => { render(); document.querySelector('main').scrollTop = 0; });
/* Les données : /api/stage, relu toutes les 3 secondes ; la page ne se redessine que quand la base a bougé. */
async function refresh() {
  const off = document.getElementById('offline');
  try {
    const answer = await (await fetch('/api/stage?since=' + encodeURIComponent(version), {cache:'no-store'})).json();
    if (answer.error) throw new Error(answer.error);
    off.hidden = true;
    if (answer.unchanged) return;
    ({version} = answer); STAGE = answer.stage; PLAYS = answer.plays;
    await render();
  } catch (error) { off.hidden = false; off.textContent = `La Scène ne lit plus la base : ${error.message}`; }
}
refresh().then(() => { tick(); setInterval(tick, 1000); setInterval(refresh, 3000); });
</script>
</body>
