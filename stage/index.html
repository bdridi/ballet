<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ballet Stage</title>
<style>
  :root { --bg:#fff; --fg:#1d1d1f; --muted:#6e6e73; --line:#e5e5ea; --panel:#f5f5f7; --pick:#e8f0fe;
          --open:#0a7d32; --escalated:#b25000; --done:#6e6e73; --worker:#3b5bdb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161618; --fg:#ececf0; --muted:#9a9aa2; --line:#2c2c30; --panel:#1f1f23; --pick:#22304d;
            --open:#4cc76f; --escalated:#f0a050; --done:#9a9aa2; --worker:#8ea6ff; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui, -apple-system, sans-serif; }
  header { padding:10px 16px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:baseline; }
  header b { font-size:15px; }
  #live { color:var(--muted); font-size:12px; }
  main { display:grid; grid-template-columns:300px 1fr; height:calc(100vh - 43px); }
  nav { border-right:1px solid var(--line); overflow:auto; padding:8px 0; }
  nav h2 { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:12px 16px 4px; }
  nav a { display:block; padding:6px 16px; color:inherit; text-decoration:none; }
  nav a:hover { background:var(--panel); }
  nav a.picked { background:var(--pick); }
  nav small { display:block; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  section { overflow:auto; padding:16px; }
  .status { font-size:12px; font-weight:600; }
  .status.open { color:var(--open); } .status.escalated { color:var(--escalated); } .status.done { color:var(--done); }
  .head { background:var(--panel); border-radius:8px; padding:12px; margin-bottom:12px; }
  .head h1 { font-size:16px; margin:0 0 4px; }
  .head p { margin:2px 0; color:var(--muted); }
  .now { font-weight:600; color:var(--fg); }
  ol { list-style:none; margin:0; padding:0; }
  li { border-bottom:1px solid var(--line); padding:6px 0; display:grid; grid-template-columns:70px 1fr; gap:8px; }
  li time { color:var(--muted); font-variant-numeric:tabular-nums; }
  li.step { color:var(--muted); }
  li.step div div { font-size:13px; }
  .who { font-weight:600; }
  .who.worker { color:var(--worker); }
  details summary { cursor:pointer; color:var(--muted); }
  pre { white-space:pre-wrap; word-break:break-word; background:var(--panel); padding:8px; border-radius:6px; margin:6px 0 0; font:12px/1.4 ui-monospace, monospace; }
  .empty { color:var(--muted); padding:24px; }
  @media (max-width: 700px) {
    main { grid-template-columns:1fr; height:auto; }
    nav { border-right:0; border-bottom:1px solid var(--line); max-height:40vh; }
    li { grid-template-columns:1fr; gap:0; }
  }
</style>
</head>
<body>
<header><b>Ballet Stage</b><span id="live">…</span></header>
<main><nav id="list"></nav><section id="detail"><p class="empty">Choisis une Rehearsal.</p></section></main>
<script>
const ROLES = ['choreographer', 'dancer', 'critic'];
let data = null, version = '', picked = decodeURIComponent(location.hash.slice(1));

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;'}[c]));
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : '';
const time = at => `<time title="${esc(new Date(at).toLocaleString('fr-FR'))}">${new Date(at).toLocaleTimeString('fr-FR')}</time>`;

/* Une Rehearsal : son état, ses entrées de journal et son rôle en cours. */
function rehearsals(project){
  return project.rehearsals.map(state => {
    const events = project.journal.filter(e => e.rehearsal === state.id);
    return {key:`${project.name}/${state.id}`, project, state, events, title:(project.titles?.[state.id] || '').replace(state.id, '').replace(/^\s*[·:-]\s*/, ''),
            last:events.at(-1)?.at || '', current:currentRole(state, events)};
  }).sort((a, b) => (a.state.status === 'done') - (b.state.status === 'done') || b.last.localeCompare(a.last));
}

/* Qui a la main : le Director sur une escalade ; sinon le dernier worker à qui le Conductor a remis quelque chose,
   tant qu'il n'a pas répondu. Les vieux journaux sans `handoff` : le rôle cité dans la dernière ligne du script. */
function currentRole(state, events){
  if (state.status === 'done') return '';
  if (state.status === 'escalated') return 'director';
  for (const e of [...events].reverse()){
    if (e.event === 'message') return 'conductor';
    if (e.event === 'handoff' || e.event === 'nudge') return e.detail.role;
    const said = (e.detail?.done || []).join(' ').match(/(choreographer|dancer|critic) (started|asked)/g);
    if (said) return said.at(-1).split(' ')[0];
  }
  return 'conductor';
}

function renderList(){
  $('#list').innerHTML = data.projects.map(project => `<h2>${esc(project.name)}</h2>` + rehearsals(project).map(r =>
    `<a href="#${esc(r.key)}" class="${r.key === picked ? 'picked' : ''}">
       <b>${esc(r.state.id)}</b> <span class="status ${r.state.status}">${r.state.status}</span>
       ${r.current ? ` · <span class="now">${cap(r.current)}</span>` : ''}
       <small>${esc(r.title || '#' + r.state.issue)}</small></a>`).join('') || '<p class="empty">Aucune Rehearsal.</p>').join('');
}

function renderDetail(){
  const r = data.projects.flatMap(rehearsals).find(r => r.key === picked);
  if (!r) return $('#detail').innerHTML = '<p class="empty">Choisis une Rehearsal.</p>';
  const s = r.state, cast = r.project.cast || {};
  const box = $('#detail'), atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
  box.innerHTML = `<div class="head">
      <h1>${esc(s.id)} ${esc(r.title)}</h1>
      <p><span class="status ${s.status}">${s.status}</span>${r.current ? ` · en cours : <span class="now">${cap(r.current)}</span>` : ''}${s.reason ? ` · ${esc(s.reason)}` : ''}</p>
      <p>issue #${esc(s.issue)}${s.pull_request ? ` · PR #${esc(s.pull_request)}` : ''} · ${esc(s.branch || 'rehearsal/' + s.id)}</p>
      <p>${ROLES.map(role => `${cap(role)} : ${esc(cast[role]?.cli || '?')}${cast[role]?.model ? ' ' + esc(cast[role].model) : ''}${s.dispatches?.[role] ? ` (${esc(s.dispatches[role])})` : ''}`).join(' · ')}</p>
    </div><ol>${r.events.map(line).join('')}</ol>`;
  if (atBottom) box.scrollTop = box.scrollHeight;
}

/* Une ligne du fil : qui parle à qui, et le texte entier dépliable quand le journal le garde. */
function line(e){
  const d = e.detail || {};
  const row = (cls, head, body) => `<li class="${cls}">${time(e.at)}<div>${head}${body || ''}</div></li>`;
  const text = t => t ? `<details><summary>texte</summary><pre>${esc(t)}</pre></details>` : '';
  switch (e.event){
    case 'handoff':
      return row('', `<span class="who">Conductor</span> → <span class="who worker">${cap(d.role)}</span> · ${esc(d.how)}${d.agent ? ` (${esc(d.agent)}${d.model ? ' ' + esc(d.model) : ''})` : ''}`, text(d.text));
    case 'nudge':
      return row('', `<span class="who">Conductor</span> → <span class="who worker">${cap(d.role)}</span> · nudge`);
    case 'message':
      return row('', `<span class="who worker">${cap(d.from)}</span> → <span class="who">${cap(d.to)}</span> · ${esc(d.type)} · ${esc(d.subject)} round ${esc(d.round)}`, text(d.text));
    case 'wait': case 'escalate': case 'done':
      return row('step', `script → <b>${e.event}</b>${d.reason ? ' : ' + esc(d.reason) : ''}`, (d.done || []).map(x => `<div>- ${esc(x)}</div>`).join(''));
    case 'diff-size':
      return row('step', `diff : ${d.counted} lignes (limite ${d.limit})${d.over ? ' · au-dessus' : ''}`);
    case 'policy':
      return row('step', `policy ${esc(d.role)} : ${d.violations?.length ? esc(d.violations.join('; ')) : 'en règle'}`);
    case 'begin':
      return row('step', '<b>begin</b>');
    default:
      return row('step', `${esc(e.event)}`, text(JSON.stringify(d, null, 2)));
  }
}

function render(){ renderList(); renderDetail(); }

addEventListener('hashchange', () => { picked = decodeURIComponent(location.hash.slice(1)); render(); $('#detail').scrollTop = 1e9; });

async function poll(){
  try {
    const answer = await (await fetch('/api/stage?since=' + encodeURIComponent(version), {cache:'no-store'})).json();
    $('#live').textContent = 'journal suivi · ' + new Date().toLocaleTimeString('fr-FR');
    if (!answer.unchanged){
      version = answer.version; data = answer;
      if (!picked){ const first = data.projects.flatMap(rehearsals)[0]; if (first) picked = first.key; }
      render();
    }
  } catch { $('#live').textContent = 'hors ligne'; }
  setTimeout(poll, 2000);
}
poll();
</script>
</body>
</html>
