<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ballet · La Scène</title>
<style>
  /* La salle éteinte : l'or du projecteur pour ce qui joue, le velours du rideau quand le Director est appelé. */
  :root {
    --bg:#0e0b10; --surface:#17131a; --panel:#211b25; --fg:#f1ebe4; --muted:#a59ca5; --faint:#6f6672; --line:#2e2733;
    --gold:#e2b76b; --gold-bg:#2c2313; --velvet:#e8607a; --velvet-bg:#3a1520; --ok:#7fcf9a; --ok-bg:#15301f; --bad:#f08080; --bad-bg:#3a1717;
    --dramaturg:#c79bf2; --choreographer:#5fd3c1; --dancer:#7fb2f5; --critic:#f5a465; --director:#e8607a;
    --serif:"Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; --mono:ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg:#f6f1e9; --surface:#fffdf9; --panel:#efe8dd; --fg:#221a1f; --muted:#6f6468; --faint:#a59a9f; --line:#e2d8ca;
      --gold:#9a6b12; --gold-bg:#f6e9c9; --velvet:#a3182f; --velvet-bg:#f9dfe3; --ok:#1c7a43; --ok-bg:#daf2e2; --bad:#b3261e; --bad-bg:#fbe0dd;
      --dramaturg:#7e3fbf; --choreographer:#0c7d70; --dancer:#2259b8; --critic:#b8530c; --director:#a3182f;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing:antialiased; }
  button, input { font:inherit; color:inherit; } a { color:inherit; text-decoration:none; }
  .mono, code { font-family:var(--mono); font-size:.92em; } code { background:var(--panel); padding:1px 6px; border-radius:4px; }
  code[data-copy] { cursor:copy; } code.copied { outline:1px solid var(--ok); }
  :focus-visible { outline:2px solid var(--gold); outline-offset:2px; border-radius:4px; }
  .muted { color:var(--muted); } .empty { color:var(--muted); font:italic 16px var(--serif); padding:18px 4px; margin:0; }
  svg.ic { width:1em; height:1em; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linejoin:round; flex:none; }
  .r-dramaturg { color:var(--dramaturg); } .r-choreographer { color:var(--choreographer); } .r-dancer { color:var(--dancer); }
  .r-critic { color:var(--critic); } .r-director { color:var(--director); } .r-script, .r-conductor { color:var(--muted); }
  .role { font-weight:600; }

  /* --- bandeau et pages --- */
  header { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:18px; height:54px; padding:0 22px; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
  .brand { font:italic 21px var(--serif); white-space:nowrap; }
  nav { display:flex; gap:2px; overflow-x:auto; } nav a { padding:5px 12px; border-radius:99px; color:var(--muted); white-space:nowrap; }
  nav a[aria-current=true] { background:var(--panel); color:var(--fg); } nav a small { color:var(--gold); margin-left:4px; font-weight:600; }
  nav.projects { border-left:1px solid var(--line); padding-left:14px; } nav.projects:empty { display:none; }
  nav i { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:6px; background:var(--faint); } nav i.open { background:var(--gold); } nav i.escalated { background:var(--velvet); }
  .live { margin-left:auto; display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12px; white-space:nowrap; }
  .live > i { width:8px; height:8px; border-radius:50%; background:var(--ok); } .live.off > i { background:var(--bad); }
  #notify { border:1px solid var(--line); background:none; border-radius:99px; padding:3px 9px; cursor:pointer; display:flex; gap:5px; align-items:center; font-size:12px; color:var(--muted); }
  #notify.on { color:var(--gold); border-color:var(--gold); }
  .alertbar { display:flex; gap:10px; align-items:center; padding:8px 22px; background:var(--velvet-bg); border-bottom:1px solid color-mix(in srgb, var(--velvet) 40%, transparent); }
  .alertbar b { color:var(--velvet); white-space:nowrap; } .alertbar span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  main { max-width:1500px; margin:0 auto; padding:22px; }
  h1 { font:500 32px/1.2 var(--serif); margin:6px 0 10px; text-wrap:balance; }
  h2 { font:500 21px/1.25 var(--serif); margin:0; text-wrap:balance; }
  h3 { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin:30px 0 12px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-weight:600; }
  h3 small { letter-spacing:0; text-transform:none; font-size:12px; font-weight:400; } h3 .chips:last-child { margin-left:auto; }
  .chip { display:inline-flex; align-items:center; gap:4px; font-size:11px; border:1px solid var(--line); border-radius:99px; padding:0 8px; color:var(--muted); white-space:nowrap; }
  .chip.kind { border-color:transparent; background:var(--panel); color:var(--fg); }
  .chips { display:flex; gap:4px; flex-wrap:wrap; letter-spacing:0; text-transform:none; }
  .chips button { border:1px solid var(--line); background:none; border-radius:99px; padding:1px 10px; font-size:12px; cursor:pointer; color:var(--muted); font-weight:400; }
  .chips button[aria-pressed=true] { background:var(--fg); color:var(--bg); border-color:var(--fg); }
  .badge { font-size:11px; border-radius:4px; padding:0 6px; background:var(--panel); color:var(--muted); font-weight:600; white-space:nowrap; }
  .badge.ok { background:var(--ok-bg); color:var(--ok); } .badge.warn { background:var(--gold-bg); color:var(--gold); } .badge.bad { background:var(--bad-bg); color:var(--bad); }

  /* --- les acteurs : un robot pour un agent, un losange à engrenage pour une étape déterministe, une silhouette pour le Director --- */
  .node { --s:30px; width:var(--s); height:var(--s); display:inline-grid; place-items:center; flex:none; font-size:calc(var(--s) * .6); position:relative; }
  .node.agent, .node.human { border-radius:50%; background:color-mix(in srgb, currentColor 16%, var(--surface)); border:1.5px solid currentColor; }
  .node.script { color:var(--muted); font-size:calc(var(--s) * .46); }
  .node.script::before { content:""; position:absolute; inset:14%; transform:rotate(45deg); border:1.5px dashed currentColor; border-radius:4px; background:var(--panel); }
  .node svg { position:relative; } .node.lg { --s:46px; }
  .node.lit { box-shadow:0 0 0 5px color-mix(in srgb, currentColor 22%, transparent); animation:glow 2.4s ease-in-out infinite; }
  @keyframes glow { 50% { box-shadow:0 0 0 11px transparent; } }

  /* --- le déroulé d'une Rehearsal : agents et étapes déterministes, dans l'ordre --- */
  .pipe { display:flex; margin:16px 0 4px; }
  .step { flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; gap:3px; position:relative; text-align:center; font-size:12px; }
  .step::before { content:""; position:absolute; top:14px; right:50%; width:100%; height:2px; background:var(--line); } .step:first-child::before { display:none; }
  .step b { font:500 14px var(--serif); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; } .step em { font-style:normal; color:var(--faint); font-size:11px; }
  .step.todo .node, .step.todo b { opacity:.38; } .step.todo { color:var(--faint); }
  .step.done::before, .step.skip::before, .step.now::before, .step.wait::before { background:var(--ok); }
  .step.script.done .node { color:var(--ok); } .step.script.warn .node { color:var(--bad); } .step.skip .node { opacity:.5; }
  .step.now .node { box-shadow:0 0 0 5px color-mix(in srgb, currentColor 22%, transparent); animation:glow 2.4s ease-in-out infinite; background:currentColor; } .step.now .node svg { color:var(--bg); }
  .step.script.now .node { background:none; box-shadow:none; color:var(--gold); animation:none; } .step.script.now .node svg { color:var(--gold); }
  .step.wait .node { color:var(--velvet); } .step.wait b { color:var(--velvet); }
  .pipe.mini { margin:0; gap:3px; width:96px; flex:none; } .pipe.mini .step { height:4px; border-radius:2px; background:var(--line); } .pipe.mini .step > *, .pipe.mini .step::before { display:none; }
  .pipe.mini .done, .pipe.mini .skip { background:var(--ok); } .pipe.mini .now { background:var(--gold); } .pipe.mini .wait { background:var(--velvet); } .pipe.mini .script { flex:.45; }

  /* --- l'appel au Director : le rideau --- */
  .call { position:relative; display:flex; gap:20px; align-items:center; padding:22px 26px; margin-bottom:18px; border-radius:16px; color:#fff5ef; overflow:hidden; box-shadow:0 14px 44px -16px #a3182f;
    background:radial-gradient(55% 130% at 8% -10%, rgba(255,216,150,.42), transparent 62%), linear-gradient(rgba(34,6,12,.35), rgba(34,6,12,.62)), repeating-linear-gradient(90deg, #6d1222 0 22px, #8f1c31 22px 34px, #561019 34px 54px); }
  .call small { letter-spacing:.16em; text-transform:uppercase; font-size:11px; color:#ffd9a0; } .call h2 { font-size:25px; margin:2px 0 6px; } .call p { margin:0; max-width:74ch; }
  .call .why { opacity:.75; font-size:13px; margin-top:4px; } .call code { background:rgba(0,0,0,.38); color:#fff; } .call > div:nth-child(2) { flex:1; min-width:0; }
  .bell { width:56px; height:56px; border-radius:50%; display:grid; place-items:center; background:#fff5ef; color:#8f1c31; font-size:28px; flex:none; animation:ring 1.8s infinite; }
  .bell svg { animation:swing 1.8s infinite; transform-origin:50% 12%; }
  @keyframes ring { 0% { box-shadow:0 0 0 0 rgba(255,245,239,.6); } 70%, 100% { box-shadow:0 0 0 20px rgba(255,245,239,0); } }
  @keyframes swing { 0%, 55%, 100% { rotate:0deg; } 10% { rotate:16deg; } 24% { rotate:-13deg; } 38% { rotate:7deg; } }
  .btn { border:1px solid currentColor; border-radius:99px; padding:6px 16px; white-space:nowrap; font-weight:600; }
  @media (prefers-reduced-motion: reduce) { .node, .bell, .bell svg { animation:none !important; } }
  @media (max-width:760px) { .call { flex-direction:column; align-items:flex-start; } #notify span { display:none; } }

  /* --- le plateau : une carte par Rehearsal en scène --- */
  .stages { display:grid; grid-template-columns:repeat(auto-fit, minmax(380px, 1fr)); gap:16px; }
  .stage { display:block; padding:20px 22px; border:1px solid var(--line); border-radius:16px; min-width:0;
    background:radial-gradient(80% 120% at 50% -50%, color-mix(in srgb, var(--gold) 18%, transparent), transparent 64%), var(--surface); transition:border-color .15s, translate .15s; }
  .stage:hover { border-color:var(--gold); translate:0 -2px; } .stage.escalated { border-color:color-mix(in srgb, var(--velvet) 60%, transparent); background:radial-gradient(80% 120% at 50% -50%, color-mix(in srgb, var(--velvet) 22%, transparent), transparent 64%), var(--surface); }
  .stage-top { display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:12px; margin-bottom:6px; } .stage-top .muted { margin-left:auto; }
  .spot { display:flex; gap:14px; align-items:center; margin-top:14px; padding:12px 14px; border-radius:12px; background:color-mix(in srgb, var(--bg) 55%, transparent); }
  .spot .sum { font-size:13px; color:var(--muted); display:flex; flex-wrap:wrap; gap:4px 6px; align-items:baseline; margin-top:2px; } .spot > div { min-width:0; }
  .gauges { display:flex; gap:18px; flex-wrap:wrap; margin-top:12px; font-size:12px; color:var(--muted); } .gauges b { color:var(--fg); font-weight:600; }
  .two { display:grid; grid-template-columns:repeat(auto-fit, minmax(340px, 1fr)); gap:0 28px; }

  /* --- les lignes : programme, archives --- */
  .row { display:grid; grid-template-columns:26px 104px minmax(0, 1fr) auto; gap:2px 10px; align-items:center; padding:9px 12px; border-radius:10px; border:1px solid transparent; }
  a.row:hover { background:var(--surface); border-color:var(--line); }
  .row .n { color:var(--faint); text-align:center; font:15px var(--serif); } .row.done .n { color:var(--ok); }
  .row .t { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .row .side { display:flex; gap:10px; align-items:center; font-size:12px; color:var(--muted); white-space:nowrap; }
  .row .side .node { --s:22px; }
  .row .more { grid-column:3 / -1; display:flex; gap:12px; align-items:center; font-size:12px; color:var(--muted); flex-wrap:wrap; }
  .row.next { opacity:.75; } .row.next .n { border:1px dashed var(--line); border-radius:50%; width:24px; height:24px; line-height:22px; font-size:12px; }
  .row.open { background:var(--gold-bg); border-color:color-mix(in srgb, var(--gold) 45%, transparent); } .row.open .n { color:var(--gold); }
  .row.escalated { background:var(--velvet-bg); border-color:color-mix(in srgb, var(--velvet) 45%, transparent); } .row.escalated .n { color:var(--velvet); }
  .progress { height:3px; background:var(--line); border-radius:2px; margin:0 0 12px; overflow:hidden; } .progress i { display:block; height:100%; background:var(--gold); }
  .stopped { margin:8px 0; padding:9px 12px; border-radius:10px; background:var(--velvet-bg); }
  .share { display:flex; height:6px; width:150px; border-radius:3px; overflow:hidden; gap:1px; flex:none; } .share i { background:currentColor; min-width:2px; }
  .share i.r-script { background:var(--faint); } .legend { display:flex; gap:6px 16px; flex-wrap:wrap; font-size:12px; color:var(--muted); margin-top:10px; align-items:center; }
  .legend span { display:inline-flex; gap:5px; align-items:center; } .legend .node { --s:20px; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:10px; margin:14px 0; }
  .stat { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 14px; min-width:0; } .stat small { display:block; color:var(--muted); font-size:11px; } .stat b { font:500 21px var(--serif); } .stat b em { font:12px system-ui, sans-serif; color:var(--muted); }
  .stat .share { width:100%; margin:10px 0 6px; }
  .bar { height:3px; background:var(--line); border-radius:2px; margin-top:6px; overflow:hidden; } .bar i { display:block; height:100%; background:var(--ok); } .bar.over i { background:var(--bad); }
  #search { width:100%; max-width:420px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:7px 12px; margin-bottom:8px; }

  /* --- la frise : une portée par Rehearsal, le temps de gauche à droite --- */
  .frise { border:1px solid var(--line); border-radius:14px; background:var(--surface); padding:12px 16px 6px; overflow:hidden; }
  .lane { display:grid; grid-template-columns:210px minmax(0, 1fr); gap:14px; align-items:center; min-height:34px; border-radius:6px; } a.lane:hover { background:var(--panel); }
  .frise.solo .lane { grid-template-columns:minmax(0, 1fr); } .frise.solo .lane > :first-child { display:none; }
  .lane .who { min-width:0; font-size:12px; } .lane .who b { font-family:var(--mono); } .lane .who span { display:block; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .track { position:relative; height:30px; display:block; } .track::before { content:""; position:absolute; inset:14px 0 auto; height:1px; background:var(--line); }
  .seg { position:absolute; top:7px; height:16px; border-radius:4px; background:currentColor; min-width:3px; }
  .seg.r-script { top:13px; height:4px; border-radius:2px; background:var(--faint); }
  .seg.r-director { background:repeating-linear-gradient(135deg, var(--velvet) 0 5px, color-mix(in srgb, var(--velvet) 45%, transparent) 5px 10px); }
  .seg.live { box-shadow:0 0 10px currentColor; }
  .mk { position:absolute; top:-3px; translate:-50% 0; font-size:11px; font-weight:700; line-height:1; } .mk.ok { color:var(--ok); } .mk.bad { color:var(--bad); } .mk.appel { color:var(--velvet); } .mk.star { color:var(--gold); font-size:13px; top:-5px; }
  .nowline { position:absolute; top:-4px; bottom:-4px; width:2px; background:var(--gold); opacity:.8; }
  .ghost { position:absolute; top:5px; border:1px dashed var(--faint); border-radius:4px; padding:0 8px; font-size:11px; color:var(--muted); line-height:18px; white-space:nowrap; }
  .axis .track { height:20px; } .axis .track::before { display:none; } .axis i { position:absolute; top:2px; font-style:normal; font-size:11px; color:var(--faint); border-left:1px solid var(--line); padding-left:5px; white-space:nowrap; }
  @media (max-width:760px) { .lane { grid-template-columns:96px minmax(0, 1fr); } .lane .who span { display:none; } .row { grid-template-columns:26px minmax(0, 1fr) auto; } .row .t { grid-column:2 / -1; } .row .more { grid-column:2 / -1; } }

  /* --- la page d'une Rehearsal : les scènes, puis le détail au clic --- */
  .hero { padding:26px 28px 20px; border:1px solid var(--line); border-radius:16px; background:radial-gradient(90% 150% at 50% -60%, color-mix(in srgb, var(--gold) 18%, transparent), transparent 62%), var(--surface); }
  .hero.done { background:var(--surface); } .crumbs { display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:12px; color:var(--muted); } .crumbs a:last-child { margin-left:auto; }
  .facts { display:flex; flex-wrap:wrap; gap:4px 16px; color:var(--muted); font-size:13px; }
  .premiere { margin-top:14px; padding:10px 14px; border-radius:10px; background:var(--ok-bg); } .premiere b { color:var(--ok); }
  .cast { display:flex; flex-wrap:wrap; gap:10px; } .actor { display:flex; gap:10px; align-items:center; border:1px solid var(--line); border-radius:12px; padding:8px 14px 8px 10px; background:var(--surface); }
  .actor small { display:block; color:var(--muted); font-size:11px; } .actor.idle { opacity:.45; } .actor b { color:var(--fg); }
  ol { list-style:none; margin:0; padding:0; }
  .scene { border-radius:10px; border:1px solid transparent; } .scene.open { background:var(--surface); border-color:var(--line); margin:6px 0; }
  .scene-head { display:grid; grid-template-columns:44px 30px minmax(0, 1fr) auto; gap:10px; align-items:center; width:100%; border:0; background:none; text-align:left; padding:7px 10px; cursor:pointer; border-radius:10px; }
  .scene-head:hover { background:var(--surface); } .scene-head time, .ev time { color:var(--faint); font-size:12px; text-align:right; font-variant-numeric:tabular-nums; }
  .sum { display:flex; flex-wrap:wrap; gap:4px 7px; align-items:baseline; min-width:0; } .dur { font:13px var(--serif); color:var(--muted); white-space:nowrap; }
  .scene.script .sum { font-size:12px; color:var(--muted); } .scene.director .scene-head { background:var(--velvet-bg); }
  .sep { font:italic 14px var(--serif); color:var(--muted); padding:16px 10px 4px; display:flex; gap:12px; align-items:center; } .sep::after { content:""; flex:1; height:1px; background:var(--line); }
  .thread { padding:4px 12px 12px 64px; border-top:1px dashed var(--line); } .ev { padding:6px 0; min-width:0; } .ev time { margin-right:8px; }
  .ev .meta { display:inline-flex; flex-wrap:wrap; gap:4px 8px; align-items:baseline; } .ev.escalate { color:var(--velvet); }
  ul.steps { margin:4px 0 0; padding-left:18px; font-size:13px; color:var(--muted); }
  pre.text { white-space:pre-wrap; word-break:break-word; margin:8px 0 0; padding:10px 12px; border-radius:8px; background:var(--panel); font:12px/1.55 var(--mono); }
  pre.text.clamp { max-height:9.4em; overflow:hidden; -webkit-mask-image:linear-gradient(#000 60%, transparent); mask-image:linear-gradient(#000 60%, transparent); }
  .morebtn { border:0; background:none; padding:2px 0; margin-top:4px; color:var(--gold); cursor:pointer; font-size:12px; display:block; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-robot" viewBox="0 0 24 24"><path d="M12 2.6V6M2.4 11v3.4M21.6 11v3.4M9.5 16h5" stroke-linecap="round"/><circle cx="12" cy="2.4" r="1.2" fill="currentColor" stroke="none"/><rect x="4.6" y="6" width="14.8" height="13" rx="4"/><circle cx="9.2" cy="11.6" r="1.5" fill="currentColor" stroke="none"/><circle cx="14.8" cy="11.6" r="1.5" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.8"/><circle cx="12" cy="12" r="6.6"/><path d="M12 2.4v3M12 18.6v3M2.4 12h3M18.6 12h3M5.2 5.2l2.1 2.1M16.7 16.7l2.1 2.1M5.2 18.8l2.1-2.1M16.7 7.3l2.1-2.1" stroke-linecap="round"/></symbol>
  <symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M5 20.5c0-4 3.1-6.6 7-6.6s7 2.6 7 6.6" stroke-linecap="round"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16.5V11a6 6 0 1 1 12 0v5.5l1.6 2H4.4zM10 21a2.1 2.1 0 0 0 4 0" stroke-linecap="round"/></symbol>
</defs></svg>
<header>
  <div class="brand">Ballet</div>
  <nav id="pages" aria-label="Pages"></nav>
  <nav class="projects" id="projects" aria-label="Projets"></nav>
  <div class="live" id="live"><button type="button" id="notify" title="Me prévenir quand le Director est appelé"><svg class="ic"><use href="#i-bell"/></svg><span>me prévenir</span></button><i></i><span id="live-text">connexion…</span></div>
</header>
<div id="alert"></div>
<main id="page"><p class="empty">Le rideau se lève…</p></main>
<script>
const ROLES = ['dramaturg', 'choreographer', 'dancer', 'critic'];
const PAGES = [['scene', 'Scène'], ['frise', 'Frise'], ['programme', 'Programme'], ['archives', 'Archives']];
const RANGES = [['3', '3 h'], ['12', '12 h'], ['24', '24 h'], ['72', '3 j'], ['all', 'tout']];
const VERB = {dramaturg:'cadre', choreographer:'planifie', dancer:'code', critic:'relit', director:'est attendu', script:'déroule ses étapes'};
const NOTE = {done:'fait', now:'en cours', wait:'attend le Director', todo:'à venir', skip:'déjà prêt'};
const KINDS = {FEAT:'feature', TASK:'tâche', BUG:'bug'};
const HOW = {start:'lancé', send:'relancé', reply:'réponse', nudge:'relance'};

let data = null, version = '', query = '', where = route(), calls = null;
let range = remembered('ballet-stage-range') || '12', filter = 'all', newestFirst = remembered('ballet-stage-order') !== 'old';
const opened = new Set();

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;'}[c]));
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : '';
const clock = at => new Date(at).toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
const day = at => new Date(at).toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'});
const icon = name => `<svg class="ic"><use href="#i-${name}"/></svg>`;
const nameOf = who => who === 'script' || who === 'conductor' ? 'Le script' : cap(who);
const role = who => `<span class="role r-${esc(who)}">${esc(nameOf(who))}</span>`;
const badge = (tone, label) => `<span class="badge ${tone}">${esc(label)}</span>`;
const minutesBetween = (from, to) => Math.max(0, Math.round((new Date(to) - new Date(from)) / 60000));
const duration = m => m < 60 ? `${m} min` : m < 2880 ? `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, '0')}` : `${Math.round(m / 1440)} j`;
const chip = (attr, key, label, on) => `<button type="button" data-${attr}="${key}" aria-pressed="${on}">${label}</button>`;
const to = (page, id = '', project = theProject()) => '#/' + [project.name, page, id].filter(Boolean).map(encodeURIComponent).join('/');
const theProject = () => data.projects.find(p => p.name === where.project) || data.projects[0];

/* Un robot pour un agent, un engrenage pour le script, une silhouette pour le Director. */
function avatar(who, cls = ''){
  if (who === 'director') return `<span class="node human r-director ${cls}">${icon('person')}</span>`;
  if (who === 'script' || who === 'conductor') return `<span class="node script ${cls}">${icon('gear')}</span>`;
  return `<span class="node agent r-${esc(who)} ${cls}">${icon('robot')}</span>`;
}

function route(){ const [, project, page, id] = location.hash.split('/').map(decodeURIComponent); return {project:project || '', page:page || 'scene', id:id || ''}; }
function remembered(key){ try { return localStorage.getItem(key); } catch { return null; } }
function remember(key, value){ try { localStorage.setItem(key, value); } catch {} }
function ago(at){
  const m = minutesBetween(at, Date.now());
  return !at ? '' : m < 1 ? "à l'instant" : m < 60 ? `il y a ${m} min` : m < 1440 ? `il y a ${Math.round(m / 60)} h` : `il y a ${Math.round(m / 1440)} j`;
}

/* --- le modèle --- */

function rehearsals(project){
  const states = project.rehearsals, absorbed = new Set(states.map(s => s.planned_by).filter(Boolean));
  const queued = new Set((project.queue?.played || []).map(e => e.rehearsal));
  return states.filter(s => !absorbed.has(s.id)).map(state => {
    const planning = state.planned_by ? states.find(s => s.id === state.planned_by) : null;
    const events = project.journal.filter(e => e.rehearsal === state.id || (planning && e.rehearsal === planning.id));
    const done = state.status === 'done', first = events[0]?.at || '', last = events.at(-1)?.at || '';
    const r = {project, state, planning, events, first, last, done, id:state.id, key:`${project.name}/${state.id}`, end:done ? last : new Date().toISOString(),
      title:cleanTitle(project.titles?.[state.id]) || (state.feature ? `planification de ${state.feature}` : ''),
      kind:state.kind || KINDS[state.id.split('-')[0]] || '', origin:originOf(state, events, queued)};
    r.minutes = first ? minutesBetween(first, r.end) : 0;
    r.scenes = scenes(r);
    r.current = done ? '' : state.status === 'escalated' ? 'director' : r.scenes.at(-1)?.who || 'script';
    r.since = r.scenes.at(-1)?.from || last;
    r.steps = steps(r);
    r.share = r.scenes.reduce((sum, s) => ({...sum, [s.who]:(sum[s.who] || 0) + s.minutes}), {});
    return r;
  }).sort((a, b) => order(a) - order(b) || b.last.localeCompare(a.last));
}

const order = r => ({escalated:0, open:1, done:2}[r.state.status] ?? 3);
const cleanTitle = title => (title || '').replace(/^(FEAT|BUG|TASK)-\d{3}(\.\d+)?\s*[·:-]?\s*/, '');

/* D'où vient la Rehearsal. `trigger` (un label GitHub, par exemple) n'existe pas encore dans les états : il sera lu dès qu'il y sera. */
function originOf(state, events, queued){
  const trigger = state.trigger || events.find(e => e.event === 'begin')?.detail?.trigger;
  if (trigger) return `label ${trigger.label || trigger}`;
  return queued.has(state.id) ? 'file' : 'lancée à la main';
}

/* Le journal découpé en scènes : qui a la main, de quand à quand. Un agent garde la main jusqu'à sa réponse ;
   le Director, de l'escalade à la reprise ; tout le reste est le script (les étapes déterministes). */
function scenes(r){
  const list = [];
  let scene = null;
  const open = (who, e) => { scene = {who, from:e.at, events:[]}; list.push(scene); };
  for (const e of r.events){
    const d = e.detail || {}, agent = scene && scene.who !== 'script' && scene.who !== 'director';
    const closes = (e.event === 'message' && agent && d.from === scene.who) || (e.event === 'director-decision' && scene?.who === 'director');
    if (closes){ scene.events.push(e); scene.closed = e; scene = null; continue; }
    if (e.event === 'handoff' || e.event === 'nudge'){ if (scene?.who !== d.role) open(d.role, e); }
    else if (e.event === 'escalate') open('director', e);
    else if ((e.event === 'done' || e.event === 'message' || !agent) && scene?.who !== 'script') open('script', e);
    scene.events.push(e);
  }
  list.forEach((s, i) => { s.i = i; s.to = list[i + 1]?.from || r.end; s.minutes = minutesBetween(s.from, s.to); });
  return list;
}

/* Le déroulé : agents et étapes déterministes, dans l'ordre. Si l'état porte un jour ses propres `steps`
   ({label, kind:'agent'|'script', role, status}), ils remplacent ce déroulé déduit du journal. */
function steps(r){
  if (Array.isArray(r.state.steps)) return r.state.steps.map(s => ({kind:s.kind || (s.role ? 'agent' : 'script'), role:s.role, label:s.label || cap(s.role), state:s.status || 'todo'}));
  const has = event => r.events.some(e => e.event === event), given = who => r.events.some(e => e.event === 'handoff' && e.detail.role === who);
  const flagged = r.state.size?.over || Object.keys(r.state.violations || {}).length > 0;
  const list = [
    {kind:'script', label:'Ouverture', seen:r.events.length > 0},
    {kind:'agent', role:'choreographer', label:'Plan', seen:given('choreographer'), optional:!r.planning},
    {kind:'agent', role:'dancer', label:'Code', seen:given('dancer')},
    {kind:'script', label:'Contrôles', seen:has('diff-size'), warn:flagged},
    {kind:'agent', role:'critic', label:'Revue', seen:given('critic')},
    {kind:'script', label:'Premiere', seen:r.done},
  ];
  const at = list.findIndex(s => s.role === r.current), reached = r.done ? list.length : at >= 0 ? at : Math.max(0, ...list.map((s, i) => s.seen ? i : 0));
  return list.map((s, i) => ({...s, state:i < reached ? (s.optional && !s.seen ? 'skip' : 'done') : i === reached ? (r.state.status === 'escalated' ? 'wait' : 'now') : 'todo'}));
}

/* La file dans l'ordre : ce qui est passé, ce qui joue, ce qui attend. */
function programme(project, all){
  const queue = project.queue || {};
  const played = (queue.played || []).map(entry => ({item:entry.item, id:entry.rehearsal, r:all.find(r => r.id === entry.rehearsal || r.planning?.id === entry.rehearsal)}));
  const next = (queue.items || []).map(item => ({item, next:true, title:cleanTitle(project.queue_titles?.[item]) || (item.startsWith('#') ? '' : 'feature à planifier')}));
  return [...played, ...next];
}

/* --- les briques --- */

const tags = r => `${r.kind ? `<span class="chip kind">${esc(r.kind)}</span>` : ''}<span class="chip" title="origine">${esc(r.origin)}</span>`;

const pipeline = (r, cls = '') => `<span class="pipe ${cls}">${r.steps.map(s => `
  <span class="step ${s.kind} ${s.state} ${s.warn ? 'warn' : ''} ${s.role ? 'r-' + esc(s.role) : ''}" title="${esc(s.label)} · ${NOTE[s.state] || ''}">
    <span class="node ${s.kind === 'agent' ? 'agent' : 'script'}">${icon(s.kind === 'agent' ? 'robot' : 'gear')}</span><b>${esc(s.label)}</b><em>${s.kind === 'agent' ? esc(cap(s.role)) : 'script'} · ${NOTE[s.state] || ''}</em></span>`).join('')}</span>`;

const shareBar = r => `<span class="share" title="${esc(shareText(r))}">${Object.entries(r.share).map(([who, m]) => `<i class="r-${esc(who)}" style="flex:${m || .2}"></i>`).join('')}</span>`;
const shareText = r => Object.entries(r.share).sort((a, b) => b[1] - a[1]).map(([who, m]) => `${nameOf(who)} ${duration(m)}`).join(' · ');

function verdictOf(d){
  const verdict = d.type === 'verdict' && (String(d.text || '').match(/VERDICT:\s*(APPROVED|REJECTED|ESCALATE)/) || [])[1];
  const outcome = d.type === 'report' && (String(d.text || '').match(/^- Outcome:\s*(\w+)/m) || [])[1];
  const tone = verdict ? {APPROVED:'ok', REJECTED:'bad', ESCALATE:'warn'}[verdict] : {question:'warn', escalation:'bad'}[d.type] || '';
  return {verdict, tone, label:verdict || (outcome ? `${d.type} · ${outcome}` : d.type)};
}

/* Une scène en une ligne : ce qu'a fait l'agent, ce qu'a déroulé le script, pourquoi le Director est appelé. */
function summary(r, s){
  if (s.who === 'script') return scriptMarks(s);
  if (s.who === 'director') return `${role('director')} appelé : ${esc(s.events[0].detail?.reason || r.state.reason)}${s.closed ? ` → ${decision(s.closed.detail || {})}` : ''}`;
  const d = s.closed?.detail, v = d && verdictOf(d);
  return `${role(s.who)} ${VERB[s.who] || 'travaille'}` + (d ? ` <span class="muted">→</span> ${role(d.to)} ${badge(v.tone, v.label)} <span class="muted">${esc(d.subject)}</span>`
    : r.done ? '' : ` ${badge('warn', 'au travail')}`);
}

function scriptMarks(s){
  const marks = s.events.map(e => {
    const d = e.detail || {};
    switch (e.event){
      case 'begin': return ['', `ouverture${d.item ? ' ' + d.item : ''}`];
      case 'policy': return [d.violations?.length ? 'bad' : 'ok', `politique ${d.role || ''} ${d.violations?.length ? '✗' : '✓'}`];
      case 'diff-size': return [d.over ? 'bad' : 'ok', `diff ${d.counted} / ${d.limit}`];
      case 'wait': return ['', 'attend'];
      case 'done': return ['ok', 'Premiere'];
      case 'handover': return ['', `passage à ${d.to}`];
      case 'message': return ['', `${d.from} → ${d.to}`];
      default: return ['', e.event];
    }
  }).filter((mark, i, all) => i === 0 || mark[1] !== all[i - 1][1]);
  return marks.map(([tone, label]) => badge(tone, label)).join('');
}

function decision(d){
  if ('approved' in d) return d.approved ? `approuve le plan de #${esc(d.plan)}` : `n'a pas encore approuvé le plan de #${esc(d.plan)}`;
  return d.verdict ? `décide <b>${esc(d.verdict)}</b>${d.comments?.length ? ` avec ${d.comments.length} commentaire(s)` : ''}` : "n'a encore rien décidé";
}

/* --- l'appel au Director --- */

function call(r){
  return `<section class="call" role="alert"><div class="bell">${icon('bell')}</div>
    <div><small>Appel au Director · ${esc(r.project.name)} · attend depuis ${duration(minutesBetween(r.since, Date.now()))}</small>
      <h2>${esc(r.id)}${r.title ? ' — ' + esc(r.title) : ''}</h2><p>${action(r)}</p><p class="why">${esc(r.state.reason)}</p></div>
    ${where.id === r.id ? '' : `<a class="btn" href="${to('r', r.id, r.project)}">Entrer en scène →</a>`}</section>`;
}

function action(r){
  const s = r.state, asked = (s.pending || []).find(q => q.to === 'director'), label = text => `<code data-copy title="copier">${text}</code>`;
  if (s.blocked_on === 'plan') return `Lis le plan de <b>#${esc(s.plan_issue)}</b> et ses slices, pose ${label('ballet:plan-approved')} sur #${esc(s.plan_issue)}, puis demande au Conductor de reprendre.`;
  if (s.blocked_on === 'size') return `Le diff dépasse le seuil : pose ${label('ballet:size-accepted')} sur la PR #${esc(s.pull_request)}, ou ${label('ballet:rejected')} avec un commentaire, puis reprends.`;
  if (asked) return `Le ${esc(cap(asked.from))} te pose une question : réponds-lui par le Conductor (un message <code>answer</code>).`;
  if (s.pull_request) return `Tranche sur la PR #${esc(s.pull_request)} : ${label('ballet:approved')}, ou ${label('ballet:rejected')} avec un commentaire, puis reprends.`;
  return 'Lis la raison ci-dessous, corrige, puis demande au Conductor de reprendre.';
}

/* --- la frise --- */

function frise(project, all, only){
  const now = Date.now(), rs = (only ? [only] : all.filter(r => r.first)).sort((a, b) => a.first.localeCompare(b.first));
  if (!rs.length) return '<p class="empty">Rien n\'a encore été joué.</p>';
  const start = only ? +new Date(only.first) : range === 'all' ? Math.min(...rs.map(r => +new Date(r.first))) : now - range * 3600000;
  const stop = only?.done ? +new Date(only.last) : now, end = stop + Math.max(stop - start, 60000) * (only ? 0 : .12);
  const x = t => Math.min(100, Math.max(0, (new Date(t) - start) / Math.max(end - start, 60000) * 100));
  const lanes = rs.filter(r => new Date(r.end) >= start).map(r => `
    <a class="lane" href="${to('r', r.id, project)}"><span class="who"><b>${esc(r.id)}</b><span>${esc(r.title)}</span></span><span class="track">${segments(r, x, start)}${only?.done ? '' : `<i class="nowline" style="left:${x(now)}%"></i>`}</span></a>`);
  const ghosts = only ? [] : (project.queue?.items || []).map(item => `
    <div class="lane"><span class="who"><b>${esc(item)}</b><span>${esc(cleanTitle(project.queue_titles?.[item]))}</span></span><span class="track"><i class="nowline" style="left:${x(now)}%"></i><span class="ghost" style="left:${x(now) + 1}%">à venir</span></span></div>`);
  return `<div class="frise ${only ? 'solo' : ''}">${lanes.join('') || '<p class="empty">Rien sur cette période : élargis la fenêtre.</p>'}${ghosts.join('')}
    <div class="lane axis"><span></span><span class="track">${ticks(start, end).map(t => `<i style="left:${x(t)}%">${tickLabel(t, end - start)}</i>`).join('')}</span></div></div>`;
}

function segments(r, x, start){
  const bars = r.scenes.filter(s => new Date(s.to) >= start).map((s, i, kept) => {
    const left = x(s.from), live = !r.done && i === kept.length - 1 && s.who !== 'script';
    return `<i class="seg r-${esc(s.who)} ${live ? 'live' : ''}" style="left:${left}%;width:${Math.max(x(s.to) - left, .2)}%" title="${esc(nameOf(s.who))} · ${duration(s.minutes)} · ${clock(s.from)}"></i>`;
  });
  const marks = r.events.filter(e => new Date(e.at) >= start).map(e => {
    const v = e.event === 'message' && verdictOf(e.detail || {}).verdict;
    const mark = e.event === 'escalate' ? ['appel', '!', 'Director appelé'] : e.event === 'done' ? ['star', '★', 'Premiere']
      : v === 'APPROVED' ? ['ok', '✓', 'APPROVED'] : v === 'REJECTED' ? ['bad', '✗', 'REJECTED'] : null;
    return mark ? `<b class="mk ${mark[0]}" style="left:${x(e.at)}%" title="${mark[2]} · ${clock(e.at)}">${mark[1]}</b>` : '';
  });
  return bars.join('') + marks.join('');
}

function ticks(start, end){
  const hours = (end - start) / 3600000, step = [.25, .5, 1, 2, 6, 12, 24, 48].find(h => hours / h <= 9) || 96, ms = step * 3600000, list = [];
  const offset = new Date().getTimezoneOffset() * 60000;
  for (let t = Math.ceil((start - offset) / ms) * ms + offset; t < end; t += ms) list.push(t);
  return list;
}
const tickLabel = (t, span) => span > 20 * 3600000 ? new Date(t).toLocaleString('fr-FR', {weekday:'short', hour:'2-digit'}) : clock(t);

const rangeChips = () => `<span class="chips">${RANGES.map(([key, label]) => chip('range', key, label, range === key)).join('')}</span>`;
const legend = () => `<div class="legend">${ROLES.map(who => `<span>${avatar(who)}${cap(who)}</span>`).join('')}<span>${avatar('script')}script (étape déterministe)</span>
  <span>${avatar('director')}Director attendu</span><span><b class="r-director">!</b> appel</span><span><b style="color:var(--ok)">✓</b> <b style="color:var(--bad)">✗</b> verdict</span><span><b style="color:var(--gold)">★</b> Premiere</span></div>`;

/* --- les lignes --- */

function row(r, mark, extra = ''){
  const s = r.state, tone = {APPROVED:'ok', REJECTED:'bad'}[s.label] || '';
  const side = r.done ? `${s.label ? badge(tone, s.label) : ''}<span>${duration(r.minutes)}</span><span>${esc(ago(r.last))}</span>`
    : `${avatar(r.current)}<span>${role(r.current)} · ${duration(minutesBetween(r.since, Date.now()))}</span>`;
  return `<a class="row ${esc(s.status)}" href="${to('r', r.id, r.project)}" title="${esc(s.reason || r.title)}">
    <span class="n">${r.done ? '✓' : mark}</span><b class="mono">${esc(r.id)}</b><span class="t">${esc(r.title || (s.issue ? '#' + s.issue : ''))}</span><span class="side">${side}</span>
    <span class="more">${tags(r)}${pipeline(r, 'mini')}${extra}</span></a>`;
}

const ghostRow = (e, n) => `<div class="row next"><span class="n">${n}</span><b class="mono">${esc(e.item)}</b><span class="t">${esc(e.title)}</span><span class="side">à venir</span></div>`;

/* --- les pages --- */

function pageScene(project, all){
  const lives = all.filter(r => !r.done), past = all.filter(r => r.done), next = programme(project, all).filter(e => e.next);
  const curtain = `<div class="hero done"><p class="empty">Le rideau est baissé : rien ne joue en ce moment${next.length ? `, ${next.length} en attente dans la file` : ''}.</p></div>`;
  return `${lives.filter(r => r.state.status === 'escalated').map(call).join('')}
    <div class="stages">${lives.map(stageCard).join('') || curtain}</div>
    <div class="two">
      <section><h3>À suivre <small>${next.length} dans la file</small></h3>${next.slice(0, 4).map((e, i) => ghostRow(e, i + 1)).join('') || '<p class="empty">La file est vide.</p>'}</section>
      <section><h3>Dernières Premieres <small><a href="${to('archives')}">toutes →</a></small></h3>${past.slice(0, 4).map(r => row(r)).join('') || '<p class="empty">Pas encore de Premiere.</p>'}</section>
    </div>
    <h3>Frise ${rangeChips()}</h3>${frise(project, all)}`;
}

function stageCard(r){
  const s = r.state, size = s.size || {}, limits = r.project.limits || {};
  const told = r.scenes.findLast(scene => scene.closed || scene.who === 'script');   // la dernière scène qui a quelque chose à dire
  return `<a class="stage ${esc(s.status)}" href="${to('r', r.id, r.project)}">
    <span class="stage-top">${tags(r)}<b class="mono">${esc(r.id)}</b><span class="muted">en scène depuis ${duration(r.minutes)}</span></span>
    <h2>${esc(r.title || r.id)}</h2>
    ${pipeline(r)}
    <span class="spot">${avatar(r.current, 'lg lit')}<span><b>${role(r.current)} ${VERB[r.current] || ''}</b> <span class="muted">depuis ${duration(minutesBetween(r.since, Date.now()))}</span>
      <span class="sum">${s.status === 'escalated' ? esc(s.reason) : told ? `<span class="muted">juste avant :</span> ${summary(r, told)}` : ''}</span></span></span>
    <span class="gauges"><span>allers-retours <b>${s.round_trips ?? 0} / ${esc(limits.max_round_trips ?? '?')}</b></span>
      <span>diff <b>${size.limit ? `${esc(size.counted)} / ${esc(size.limit)}` : '—'}</b></span><span>questions <b>${(s.pending || []).length}</b></span>${s.pull_request ? `<span>PR <b>#${esc(s.pull_request)}</b></span>` : ''}</span></a>`;
}

function pageFrise(project, all){
  return `<h3>Frise <small>une portée par Rehearsal, le présent sous le trait doré</small>${rangeChips()}</h3>${frise(project, all)}${legend()}`;
}

function pageProgramme(project, all){
  const entries = programme(project, all), queue = project.queue || {}, done = entries.filter(e => e.r?.done).length;
  const inQueue = new Set(entries.map(e => e.r?.id)), others = all.filter(r => !r.done && !inQueue.has(r.id));
  const stopped = ![].concat(queue.current || []).length && (queue.items || []).length
    ? `<div class="stopped">File arrêtée avant <b>${esc(queue.items[0])}</b> : à corriger, puis <code>resume</code>.</div>` : '';
  return `<h1>Programme ${queue.plan ? `<span class="chip">plan ${esc(queue.plan)}</span>` : ''}</h1>
    ${entries.length ? `<p class="muted">${done} jouée(s) sur ${entries.length}</p><div class="progress"><i style="width:${done / entries.length * 100}%"></i></div>` : '<p class="empty">Aucune file en cours.</p>'}
    ${stopped}${entries.map((e, i) => e.next ? ghostRow(e, i + 1) : e.r ? row(e.r, i + 1, e.item !== '#' + e.r.state.issue ? `<span>← ${esc(e.item)}</span>` : '') : ghostRow({item:e.id, title:e.item}, i + 1)).join('')}
    ${others.length ? `<h3>Hors programme <small>en scène sans passer par la file</small></h3>${others.map(r => row(r, '◆')).join('')}` : ''}`;
}

function pageArchives(project, all){
  const past = all.filter(r => r.done), sorted = past.map(r => r.minutes).sort((a, b) => a - b), median = sorted.length ? sorted[Math.floor((sorted.length - 1) / 2)] : 0;
  const clean = past.filter(r => !r.state.round_trips && !r.events.some(e => e.event === 'escalate')).length;
  const total = past.reduce((sum, r) => { for (const [who, m] of Object.entries(r.share)) sum[who] = (sum[who] || 0) + m; return sum; }, {});
  const found = past.filter(r => `${r.id} ${r.title} ${r.kind} #${r.state.issue} #${r.state.pull_request}`.toLowerCase().includes(query));
  return `<h1>Archives</h1>
    <div class="stats"><div class="stat"><small>Premieres</small><b>${past.length}</b></div><div class="stat"><small>Durée médiane</small><b>${duration(median)}</b></div>
      <div class="stat"><small>Sans accroc (ni aller-retour ni appel)</small><b>${clean}<em> / ${past.length}</em></b></div>
      <div class="stat" style="grid-column:span 2"><small>Où le temps est parti</small>${shareBar({share:total})}<small>${esc(shareText({share:total}))}</small></div></div>
    <input id="search" type="search" placeholder="Chercher une Premiere…  ( / )" aria-label="Chercher dans les archives" value="${esc(query)}">
    ${found.map(r => row(r, '', `${shareBar(r)}<span>${r.state.size?.counted ? esc(r.state.size.counted) + ' lignes' : ''}</span><span>${r.state.round_trips ? r.state.round_trips + ' aller-retour' : ''}</span><span>${r.state.pull_request ? 'PR #' + esc(r.state.pull_request) : ''}</span>`)).join('')
      || `<p class="empty">${past.length ? 'Aucune Premiere ne correspond.' : 'Pas encore de Premiere.'}</p>`}`;
}

function pageRehearsal(project, all){
  const r = all.find(r => r.id === where.id);
  if (!r) return `<p class="empty">Cette Rehearsal n'est pas dans ce projet. <a href="${to('scene')}">Retour à la Scène</a></p>`;
  const s = r.state, limits = project.limits || {}, size = s.size || {}, percent = size.limit ? Math.min(100, Math.round(size.counted / size.limit * 100)) : 0;
  const facts = [s.issue ? `issue #${esc(s.issue)}` : s.feature ? `feature ${esc(s.feature)}` : '', s.pull_request ? `PR #${esc(s.pull_request)}` : '', `<span class="mono">rehearsal/${esc(s.id)}</span>`,
    r.planning ? `planifiée dans ${esc(r.planning.id)}` : '', s.plan ? `plan ${esc(s.plan)}` : '', r.last ? `dernier mouvement ${esc(ago(r.last))}` : ''].filter(Boolean);
  const cells = [['Allers-retours Dancer ↔ Critic', `${s.round_trips ?? 0}<em> / ${esc(limits.max_round_trips ?? '?')}</em>`],
    [`Diff${size.over ? ' · au-dessus' : ''}`, size.limit ? `${esc(size.counted)}<em> / ${esc(size.limit)} lignes</em></b><div class="bar ${size.over ? 'over' : ''}"><i style="width:${percent}%"></i></div><b>` : '—'],
    ['Questions en attente', (s.pending || []).length], ['Appels au Director', r.events.filter(e => e.event === 'escalate').length], ['Verdict', s.label ? esc(s.label) : '—'], ['Durée', r.first ? duration(r.minutes) : '—']];
  return `${s.status === 'escalated' ? call(r) : ''}
    <div class="hero ${esc(s.status)}">
      <div class="crumbs">${tags(r)}<span class="mono">${esc(s.id)}</span><span>${r.done ? 'Premiere' : s.status === 'escalated' ? 'attend le Director' : 'en scène'}</span><a href="${to('scene')}">← la Scène</a></div>
      <h1>${esc(r.title || s.id)}</h1><div class="facts">${facts.map(f => `<span>${f}</span>`).join('')}</div>
      ${r.done && s.reason ? `<div class="premiere"><b>Premiere</b> · ${esc(s.reason)}</div>` : ''}
      ${pipeline(r)}
    </div>
    <div class="stats">${cells.map(([label, value]) => `<div class="stat"><small>${label}</small><b>${value}</b></div>`).join('')}</div>
    <h3>Où le temps est parti <small>${esc(shareText(r))}</small></h3>${frise(project, all, r)}
    <h3>Distribution</h3>${cast(r)}
    ${sceneList(r)}`;
}

function cast(r){
  const profile = r.project.cast || {}, dispatches = r.state.dispatches || {};
  return `<div class="cast">${ROLES.map(who => `<div class="actor ${dispatches[who] ? '' : 'idle'}" title="${esc(dispatches[who] || 'pas lancé dans cette Rehearsal')}">
    ${avatar(who, r.current === who ? 'lit' : '')}<div><b>${cap(who)}</b><small>${esc(profile[who]?.cli || '?')}${profile[who]?.model ? ' · ' + esc(profile[who].model) : ''}${r.share[who] ? ' · ' + duration(r.share[who]) : ''}</small></div></div>`).join('')}</div>`;
}

/* --- les scènes d'une Rehearsal, le détail au clic --- */

function sceneList(r){
  const sort = s => s.who === 'script' ? 'script' : s.who === 'director' ? 'director' : 'agent';
  const kept = r.scenes.filter(s => filter === 'all' || sort(s) === filter);
  if (newestFirst) kept.reverse();
  let lastDay = '';
  const rows = kept.map(s => {
    const key = `${r.key}#${s.i}`, open = opened.has(key), head = day(s.from) !== lastDay ? `<li class="sep">${esc(lastDay = day(s.from))}</li>` : '';
    return `${head}<li class="scene ${sort(s)} ${open ? 'open' : ''}">
      <button type="button" class="scene-head" data-open="${esc(key)}" aria-expanded="${open}"><time>${clock(s.from)}</time>${avatar(s.who)}<span class="sum">${summary(r, s)}</span><span class="dur">${duration(s.minutes)}</span></button>
      ${open ? `<ol class="thread">${s.events.map((e, i) => event(e, `${key}|${i}`)).join('')}</ol>` : ''}</li>`;
  }).join('');
  const kinds = [['all', 'Tout'], ['agent', 'Agents'], ['script', 'Script'], ['director', 'Director']].map(([key, label]) => chip('filter', key, label, filter === key)).join('');
  return `<h3>Scènes <small>${kept.length} / ${r.scenes.length} · un clic ouvre le détail</small><span class="chips">${kinds}</span>
    <span class="chips">${chip('order', '', newestFirst ? '↓ récent d’abord' : '↑ ancien d’abord', false)}</span></h3><ol>${rows || '<li class="empty">Rien à montrer ici.</li>'}</ol>`;
}

function event(e, key){
  const d = e.detail || {}, line = (cls, html, extra = '') => `<li class="ev ${cls}"><time>${clock(e.at)}</time>${html}${extra}</li>`;
  switch (e.event){
    case 'message': { const v = verdictOf(d); return line('', `<span class="meta">${role(d.from)}<span class="muted">→</span>${role(d.to)}${badge(v.tone, v.label)}<span class="muted">${esc(d.subject)}${d.round > 1 ? ` · tour ${esc(d.round)}` : ''}</span></span>`,
      text(String(d.text || '').replace(/^\{"ballet":[^\n]*\n+/, ''), key, 6)); }
    case 'handoff': return line('', `<span class="meta">${role('script')}<span class="muted">→</span>${role(d.role)}${badge('', HOW[d.how] || d.how)}${d.agent ? `<span class="muted">${esc(d.agent)}${d.model ? ' ' + esc(d.model) : ''}</span>` : ''}</span>`, text(d.text, key, 0));
    case 'nudge': return line('', `relance ${role(d.role)}`);
    case 'handover': return line('', `<b>Passage de main</b> : le worktree de la planification joue <b>${esc(d.to)}</b> (#${esc(d.issue)})${d.planned ? `, slice de #${esc(d.planned)}` : ''}`);
    case 'director-decision': return line('', `${role('director')} ${decision(d)}`);
    case 'begin': return line('', `<b>Ouverture</b>${d.item ? ` de ${esc(d.item)}` : ''}${d.plan ? ` · plan ${esc(d.plan)}` : ''}`);
    case 'wait': case 'escalate': case 'done': return line(e.event === 'escalate' ? 'escalate' : '', `<b>${{wait:'Le script attend', escalate:'Appel au Director', done:'Terminé'}[e.event]}</b>${d.reason ? ` : ${esc(d.reason)}` : ''}`,
      (d.done || []).length ? `<ul class="steps">${d.done.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '');
    case 'diff-size': return line('', `<b>Diff</b> : ${esc(d.counted)} lignes sur ${esc(d.limit)}${d.excluded ? `, ${esc(d.excluded)} exclues` : ''}${d.over ? ' · au-dessus' : ''}`);
    case 'policy': return line('', `<b>Politique</b> · ${role(d.role)} ${d.violations?.length ? `: ${d.violations.length} violation(s)<ul class="steps">${d.violations.map(v => `<li>${esc(v)}</li>`).join('')}</ul>` : 'en règle'}`);
    default: return line('', `<b>${esc(e.event)}</b>`, text(JSON.stringify(d, null, 2), key, 0));
  }
}

/* Le texte entier, replié au-delà de quelques lignes ; `lines` = 0 : caché tant qu'on ne l'ouvre pas. */
function text(t, key, lines){
  if (!t) return '';
  const count = String(t).split('\n').length, open = opened.has(key), size = `${count} ligne${count > 1 ? 's' : ''}`;
  if (!lines && !open) return `<button type="button" class="morebtn" data-open="${esc(key)}">voir le texte (${size})</button>`;
  const long = count > lines;
  return `<pre class="text ${long && !open ? 'clamp' : ''}">${esc(t)}</pre>` + (long || !lines ? `<button type="button" class="morebtn" data-open="${esc(key)}">${open ? 'replier' : `tout afficher (${size})`}</button>` : '');
}

/* --- vie de la page --- */

const VIEWS = {scene:pageScene, frise:pageFrise, programme:pageProgramme, archives:pageArchives, r:pageRehearsal};

function render(){
  if (!data) return;
  const project = theProject();
  if (!project) return $('#page').innerHTML = '<p class="empty">La salle est vide : aucun projet.</p>';
  const all = rehearsals(project), searching = document.activeElement?.id === 'search';
  renderHeader(project, all);
  $('#page').innerHTML = (VIEWS[where.page] || pageScene)(project, all);
  if (searching && $('#search')){ $('#search').focus(); $('#search').setSelectionRange(query.length, query.length); }
}

function renderHeader(project, all){
  const counts = {scene:all.filter(r => !r.done).length, programme:(project.queue?.items || []).length, archives:all.filter(r => r.done).length};
  $('#pages').innerHTML = PAGES.map(([key, label]) => `<a href="${to(key)}" aria-current="${where.page === key}">${label}${counts[key] ? `<small>${counts[key]}</small>` : ''}</a>`).join('');
  $('#projects').innerHTML = data.projects.length < 2 ? '' : data.projects.map(p => {
    const mood = p.rehearsals.some(s => s.status === 'escalated') ? 'escalated' : p.rehearsals.some(s => s.status === 'open') ? 'open' : '';
    return `<a href="${to(where.page === 'r' ? 'scene' : where.page, '', p)}" aria-current="${p === project}"><i class="${mood}"></i>${esc(p.name)}</a>`;
  }).join('');
  const waiting = data.projects.flatMap(rehearsals).filter(r => r.state.status === 'escalated');
  document.title = (waiting.length ? `(${waiting.length}) ` : '') + 'Ballet · La Scène';
  const elsewhere = waiting.filter(r => !(r.project === project && (where.page === 'scene' || where.id === r.id)));
  $('#alert').innerHTML = elsewhere.map(r => `<a class="alertbar" href="${to('r', r.id, r.project)}">${icon('bell')}<b>Le Director est appelé</b><span>${esc(r.project.name)} · ${esc(r.id)} — ${esc(r.state.reason || r.title)}</span></a>`).join('');
  announce(waiting);
}

/* Une notification du navigateur à chaque nouvel appel, si le Director l'a demandé. */
function announce(waiting){
  if (calls && 'Notification' in window && Notification.permission === 'granted')
    waiting.filter(r => !calls.has(r.key)).forEach(r => new Notification('Ballet · le Director est appelé', {body:`${r.id} — ${r.state.reason || r.title}`}));
  calls = new Set(waiting.map(r => r.key));
}

function setupNotify(){
  const button = $('#notify');
  if (!('Notification' in window)) return button.remove();
  const show = () => { button.classList.toggle('on', Notification.permission === 'granted'); button.lastElementChild.textContent = Notification.permission === 'granted' ? 'prévenu' : 'me prévenir'; };
  button.addEventListener('click', () => Notification.requestPermission().then(show));
  show();
}

document.addEventListener('click', event => {
  const on = attr => event.target.closest(`[data-${attr}]`);
  if (on('copy')){ const code = on('copy'); navigator.clipboard?.writeText(code.textContent); code.classList.add('copied'); return; }
  if (on('open')){ const key = on('open').dataset.open; opened.has(key) ? opened.delete(key) : opened.add(key); }
  else if (on('filter')) filter = on('filter').dataset.filter;
  else if (on('range')){ range = on('range').dataset.range; remember('ballet-stage-range', range); }
  else if (on('order')){ newestFirst = !newestFirst; remember('ballet-stage-order', newestFirst ? 'new' : 'old'); }
  else return;
  render();
});

document.addEventListener('keydown', event => {
  if (event.metaKey || event.ctrlKey || event.altKey || !data) return;
  if (event.target.matches('input')){ if (event.key === 'Escape') event.target.blur(); return; }
  const page = PAGES[+event.key - 1];
  if (page) location.hash = to(page[0]);
  else if (event.key === '/'){ event.preventDefault(); if (where.page !== 'archives') location.hash = to('archives'); setTimeout(() => $('#search')?.focus(), 0); }
  else if ((event.key === 'j' || event.key === 'k') && where.page === 'r'){
    const all = rehearsals(theProject()), next = all[all.findIndex(r => r.id === where.id) + (event.key === 'j' ? 1 : -1)];
    if (next) location.hash = to('r', next.id);
  }
});

document.addEventListener('input', event => { if (event.target.id === 'search'){ query = event.target.value.trim().toLowerCase(); render(); } });
addEventListener('hashchange', () => { where = route(); render(); scrollTo(0, 0); });

async function poll(){
  try {
    const answer = await (await fetch('/api/stage?since=' + encodeURIComponent(version), {cache:'no-store'})).json();
    $('#live').classList.remove('off');
    $('#live-text').textContent = 'en direct · ' + new Date().toLocaleTimeString('fr-FR');
    if (!answer.unchanged){ version = answer.version; data = answer; render(); }
  } catch {
    $('#live').classList.add('off');
    $('#live-text').textContent = 'hors ligne';
  }
  setTimeout(poll, 2000);
}
setInterval(() => { if (!getSelection().toString() && document.activeElement?.id !== 'search') render(); }, 30000);   // les chronos avancent
setupNotify();
poll();
</script>
