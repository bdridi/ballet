<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1240" width="960" height="1240" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Ballet: from a need to the Premiere</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F4D36"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D9534A"/>
    </marker>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="0" flood-color="#B9DD8F"/>
    </filter>
  </defs>

  <style>
    .card { fill: #FFFFFF; stroke: #1F4D36; stroke-width: 2; filter: url(#s); }
    .dark { fill: #1F4D36; }
    .h { font-size: 15px; font-weight: 800; letter-spacing: 1.5px; fill: #1F4D36; }
    .t { font-size: 15px; fill: #1B1B1B; }
    .b { font-size: 17px; font-weight: 700; fill: #1B1B1B; }
    .s { font-size: 13px; fill: #4A4A4A; }
    .lbl { font-size: 14px; fill: #1B1B1B; }
    .red { font-size: 14px; font-weight: 600; fill: #D9534A; }
    .w { fill: #FFFFFF; }
    .line { stroke: #1F4D36; stroke-width: 2.5; fill: none; }
    .redline { stroke: #D9534A; stroke-width: 2.5; fill: none; stroke-dasharray: 2 6; stroke-linecap: round; }
    .tag { fill: #E4F5D0; stroke: #1F4D36; stroke-width: 1.5; }
  </style>

  <rect width="960" height="1240" fill="#F6F3EC"/>

  <!-- Titre -->
  <text x="480" y="72" text-anchor="middle" font-size="44" font-weight="800" fill="#141414" letter-spacing="-1">From a need to the Premiere</text>
  <rect x="188" y="94" width="584" height="54" rx="10" fill="#C9EBA0"/>
  <text x="480" y="132" text-anchor="middle" font-size="32" font-weight="800" fill="#141414" letter-spacing="-0.5">agents do the work, you decide</text>

  <!-- ① Workshop -->
  <rect x="30" y="180" width="900" height="250" rx="18" fill="#EAF4DC" stroke="#1F4D36" stroke-width="2"/>
  <text x="54" y="212" class="h">① WORKSHOP · WHAT AND WHY</text>
  <text x="906" y="212" text-anchor="end" class="s">assisted: with you · autopilot: without you</text>

  <!-- Le besoin -->
  <rect x="54" y="236" width="230" height="160" rx="14" class="card"/>
  <rect x="72" y="254" width="60" height="22" rx="6" fill="#FBE3E1"/>
  <text x="102" y="270" text-anchor="middle" font-size="12" font-weight="700" fill="#D9534A">BUG-004</text>
  <text x="72" y="304" class="b">Promo code refused</text>
  <text x="72" y="326" class="b">at checkout</text>
  <text x="72" y="356" class="s">a need, a bug, feedback,</text>
  <text x="72" y="374" class="s">or "what's next?"</text>

  <path d="M290 316 H338" class="line" marker-end="url(#a)"/>

  <!-- Dramaturg -->
  <rect x="346" y="250" width="210" height="144" rx="14" class="card"/>
  <circle cx="451" cy="292" r="24" fill="#C9EBA0" stroke="#1F4D36" stroke-width="2"/>
  <path d="M440 284 h22 M440 292 h22 M440 300 h14" stroke="#1F4D36" stroke-width="3" stroke-linecap="round"/>
  <text x="451" y="342" text-anchor="middle" class="h">DRAMATURG</text>
  <text x="451" y="364" text-anchor="middle" class="s">frames it with you, as</text>
  <text x="451" y="380" text-anchor="middle" class="s">testable criteria</text>

  <!-- Choreographer -->
  <path d="M562 302 H658" class="line" marker-end="url(#a)"/>
  <path d="M658 334 H562" class="line" marker-end="url(#a)"/>
  <text x="610" y="292" text-anchor="middle" class="lbl">asks</text>
  <text x="610" y="356" text-anchor="middle" class="lbl">S or M?</text>

  <rect x="666" y="250" width="240" height="144" rx="14" class="card"/>
  <circle cx="786" cy="292" r="24" fill="#C9EBA0" stroke="#1F4D36" stroke-width="2"/>
  <path d="M774 302 l8 -18 l8 12 l8 -8" stroke="#1F4D36" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="786" y="342" text-anchor="middle" class="h">CHOREOGRAPHER</text>
  <text x="786" y="364" text-anchor="middle" class="s">technical opinion, early:</text>
  <text x="786" y="380" text-anchor="middle" class="s">it can change the product</text>

  <!-- Jonction -->
  <path d="M480 430 V478" class="line" marker-end="url(#a)"/>
  <text x="492" y="460" class="lbl">publishes the issue</text>

  <rect x="30" y="486" width="900" height="132" rx="18" fill="#FFFFFF" stroke="#1F4D36" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="54" y="516" class="h">JUNCTION · THE GITHUB QUEUE</text>

  <rect x="54" y="534" width="190" height="64" rx="12" fill="#FFFFFF" stroke="#9A9A9A" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="72" y="560" class="t" font-weight="700">#42 proposed</text>
  <text x="72" y="582" class="s">framed without you</text>

  <path d="M250 566 H318" class="line" marker-end="url(#a)"/>
  <text x="284" y="556" text-anchor="middle" class="lbl">your yes</text>

  <rect x="326" y="530" width="250" height="72" rx="12" class="card"/>
  <svg x="342" y="546" width="22" height="22" viewBox="0 0 16 16"><path fill="#1F4D36" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
  <text x="372" y="564" class="t" font-weight="700">#42 ready</text>
  <rect x="456" y="548" width="52" height="20" rx="10" class="tag"/>
  <text x="482" y="563" text-anchor="middle" font-size="11" font-weight="700" fill="#1F4D36">Size M</text>
  <text x="342" y="590" class="s">Feature · assisted · priority 1</text>

  <path d="M582 566 H650" class="line" marker-end="url(#a)"/>
  <rect x="658" y="534" width="248" height="64" rx="12" class="dark"/>
  <text x="676" y="560" class="w" font-size="14" font-weight="700">Monitor sees it,</text>
  <text x="676" y="582" class="w" font-size="14" font-weight="700">Maestro starts a Conductor</text>

  <!-- ② Rehearsal -->
  <path d="M782 618 V666" class="line" marker-end="url(#a)"/>

  <rect x="30" y="674" width="900" height="330" rx="18" fill="#EAF4DC" stroke="#1F4D36" stroke-width="2"/>
  <text x="54" y="706" class="h">② REHEARSAL · HOW · ONE PULL REQUEST</text>
  <text x="906" y="706" text-anchor="end" class="s">every step published on GitHub</text>

  <!-- Plan -->
  <rect x="54" y="730" width="180" height="150" rx="14" class="card"/>
  <rect x="74" y="750" width="140" height="10" rx="5" fill="#C9EBA0"/>
  <rect x="74" y="768" width="110" height="10" rx="5" fill="#C9EBA0"/>
  <rect x="74" y="786" width="124" height="10" rx="5" fill="#C9EBA0"/>
  <text x="144" y="826" text-anchor="middle" class="h">PLAN</text>
  <text x="144" y="846" text-anchor="middle" class="s">on the real main,</text>
  <text x="144" y="862" text-anchor="middle" class="s">2-3 slices if big</text>

  <path d="M240 798 H280" class="line" marker-end="url(#a)"/>

  <!-- Dancer -->
  <rect x="288" y="730" width="180" height="150" rx="14" class="dark" filter="url(#s)"/>
  <text x="306" y="760" fill="#C9EBA0" font-size="18" font-weight="800" font-family="Menlo, Consolas, monospace">$_ test</text>
  <rect x="306" y="772" width="66" height="16" rx="8" fill="#D9534A"/>
  <path d="M380 780 h10" stroke="#FFFFFF" stroke-width="2" marker-end="url(#a)"/>
  <rect x="396" y="772" width="56" height="16" rx="8" fill="#8FD16A"/>
  <text x="378" y="826" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="800" letter-spacing="1.5">DANCER</text>
  <text x="378" y="846" text-anchor="middle" fill="#D8E8CC" font-size="13">red test, then green,</text>
  <text x="378" y="862" text-anchor="middle" fill="#D8E8CC" font-size="13">one commit per task</text>

  <path d="M474 798 H514" class="line" marker-end="url(#a)"/>

  <!-- Scripts -->
  <rect x="522" y="730" width="180" height="150" rx="14" class="card"/>
  <path d="M592 752 h40 l10 18 l-10 18 h-40 l-10 -18 z" fill="#C9EBA0" stroke="#1F4D36" stroke-width="2"/>
  <path d="M600 770 l8 8 l16 -16" stroke="#1F4D36" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="612" y="826" text-anchor="middle" class="h">SCRIPTS</text>
  <text x="612" y="846" text-anchor="middle" class="s">stayed in its lane? tests</text>
  <text x="612" y="862" text-anchor="middle" class="s">run again, mutation test</text>

  <path d="M708 798 H748" class="line" marker-end="url(#a)"/>

  <!-- Critic -->
  <rect x="756" y="730" width="150" height="150" rx="14" class="card"/>
  <circle cx="824" cy="768" r="16" fill="none" stroke="#1F4D36" stroke-width="3"/>
  <path d="M836 780 l12 12" stroke="#1F4D36" stroke-width="4" stroke-linecap="round"/>
  <text x="831" y="826" text-anchor="middle" class="h">CRITIC</text>
  <text x="831" y="846" text-anchor="middle" class="s">another model,</text>
  <text x="831" y="862" text-anchor="middle" class="s">reads, never writes</text>

  <!-- Boucle de correction -->
  <path d="M800 886 V916 Q800 928 788 928 H390 Q378 928 378 916 V888" class="line" marker-end="url(#a)"/>
  <text x="430" y="918" class="lbl">rejected: the Dancer fixes</text>
  <text x="640" y="918" class="lbl" font-weight="700">round 1 of 2</text>
  <circle cx="742" cy="913" r="7" fill="#D9534A"/>
  <circle cx="764" cy="913" r="7" fill="#FFFFFF" stroke="#1F4D36" stroke-width="2"/>

  <text x="176" y="964" class="red">✕ still rejected, out of its lane twice, red tests too often, or a question nobody can answer:</text>
  <text x="190" y="986" class="red">the line stops and Maestro asks you, on your phone too</text>

  <!-- Premiere -->
  <path d="M880 886 V1060" class="line" marker-end="url(#a)"/>
  <text x="868" y="1036" text-anchor="end" class="lbl">✓ approved</text>

  <rect x="776" y="1068" width="130" height="110" rx="14" class="card"/>
  <svg x="823" y="1084" width="36" height="36" viewBox="0 0 16 16"><path fill="#1F4D36" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
  <text x="841" y="1144" text-anchor="middle" class="h">PULL</text>
  <text x="841" y="1164" text-anchor="middle" class="h">REQUEST</text>

  <path d="M770 1122 H616" class="line" marker-end="url(#a)"/>
  <text x="693" y="1112" text-anchor="middle" class="lbl">✓ CI green</text>

  <rect x="456" y="1068" width="154" height="110" rx="14" fill="#C9EBA0" stroke="#1F4D36" stroke-width="2" filter="url(#s)"/>
  <circle cx="533" cy="1102" r="20" fill="#FFFFFF" stroke="#1F4D36" stroke-width="2"/>
  <path d="M523 1102 l7 7 l13 -14" stroke="#1F4D36" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="533" y="1146" text-anchor="middle" class="h">PREMIERE</text>
  <text x="533" y="1166" text-anchor="middle" class="s">merged on main</text>

  <path d="M450 1122 H144 V886" class="line" stroke-dasharray="7 6" marker-end="url(#a)"/>
  <text x="300" y="1112" text-anchor="middle" class="lbl">next slice, from the new main</text>

  <text x="30" y="1220" class="s" font-size="14">Agents frame, plan, code and review. Scripts check. You decide.</text>
  <text x="930" y="1220" text-anchor="end" class="s" font-size="14" font-weight="700">Ballet</text>
</svg>
