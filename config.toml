# Défauts de Ballet. Un projet les surcharge clé par clé dans .ballet/config.toml.

[project]
merge = "trunk"                  # ou "pr"
specs_language = "en"            # langue des specs ; le code est toujours en anglais
adr = "docs/ADR/"                # décisions d'architecture : seul le Choreographer y écrit
rules = []                       # règles communes appliquées (noms de skills), à choisir par le projet

[roles.dramaturg]
cli = "claude"

[roles.choreographer]
cli = "claude"
model = "opus"

[roles.dancer]
cli = "claude"
model = "sonnet"                 # Critic ≠ Dancer : même CLI, modèles explicites différents

[roles.critic]
cli = "claude"
model = "opus"

[policy]
sensitive_zones = []             # globs, valables dans tous les repos

[escalation]
max_round_trips = 2              # allers-retours Dancer ↔ Critic
max_exchange_rounds = 3          # tours de questions entre deux rôles sur un même sujet (message.md)
max_diff_lines = 400             # taille de diff au-delà de laquelle on escalade
