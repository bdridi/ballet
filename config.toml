# Défauts de Ballet. Un projet les surcharge clé par clé dans .ballet/config.toml.

[project]
specs_language = "en"            # langue des specs ; le code est toujours en anglais
adr = "docs/ADR/"                # décisions d'architecture : seul le Choreographer y écrit
rules = []                       # règles communes appliquées (noms de skills), à choisir par le projet

[roles.dramaturg]
cli = "claude"

[roles.choreographer]
cli = "claude"
model = "opus"

[roles.dancer]
cli = "claude"
model = "sonnet"                 # Critic ≠ Dancer : même CLI, modèles explicites différents

[roles.critic]
cli = "claude"
model = "opus"

[policy]
# Une zone est un glob fnmatch (`*` traverse les `/`) : sans `/`, il vaut à toute profondeur ; avec, il part de la racine.
# Une liste surchargée remplace celle du plugin : la recopier pour y ajouter.
sensitive_zones = []             # zones propres au projet (contrat d'API, sécurité…), en plus des zones interdites
forbidden_zones = [              # le harnais, la CI et les hooks git
  "AGENTS.md", "CLAUDE.md", ".ballet/*", ".claude/*", ".agents/*", ".vibe/*", ".codex/*", ".grok/*", ".mcp.json",
  ".github/*", ".gitlab-ci.yml", ".circleci/*", ".husky/*", ".githooks/*", "lefthook.yml", ".pre-commit-config.yaml",
]

# Le périmètre de chaque rôle : un chemin est permis s'il est dans `writes` (ou `extra_writes`) et hors de `except`
# (et `extra_except`) ; `except` l'emporte. `writes` et `except` sont la méthode : un projet peut les remplacer.
# `extra_writes` et `extra_except` sont à lui : il y ajoute sans recopier la méthode (`extra_writes = ["docs/*"]`).
# `@specs`, `@adr`, `@forbidden` et `@sensitive` nomment [project] specs, [project] adr, forbidden_zones et sensitive_zones.
# `branches` : les branches que le rôle peut créer. Aucun rôle ne peut écrire `.ballet/config.toml`.
[policy.roles.dramaturg]
writes = ["@specs"]
except = []
extra_writes = []
extra_except = []
branches = []

[policy.roles.choreographer]
writes = ["@adr", "AGENTS.md"]
except = []
extra_writes = []
extra_except = []
branches = ["spike/*"]           # ses spikes, jamais mergés

[policy.roles.dancer]
writes = ["*"]
except = ["@specs", "@adr", "@forbidden", "@sensitive"]
extra_writes = []
extra_except = []
branches = []

[policy.roles.critic]
writes = []                      # lecture seule : HEAD ne bouge pas
except = []
extra_writes = []
extra_except = []
branches = []

# Un test existant se reconnaît par son nom : par langage, ses extensions et un motif dont le dernier groupe est le nom.
# Un projet ajoute un langage par sa propre table ([policy.test_names.go]).
[policy.test_names.javascript]
extensions = [".js", ".jsx", ".ts", ".tsx", ".mjs", ".cjs"]
pattern = '''\b(?:it|test)(?:\.\w+)?\(\s*(['"`])(.+?)\1'''

[policy.test_names.rust]
extensions = [".rs"]
pattern = '''#\[(?:[\w:]+::)?test\b[^\]]*\]\s*(?:#\[[^\]]*\]\s*)*(?:pub\s+)?(?:async\s+)?fn\s+(\w+)'''

[policy.test_names.python]
extensions = [".py"]
pattern = '''(?m)^\s*(?:async\s+)?def\s+(test\w*)'''

[policy.test_names.gherkin]
extensions = [".feature"]
pattern = '''(?m)^\s*(?:Scenario|Scenario Outline|Scenario Template|Example):\s*(.+?)\s*$'''

[rehearsal]
plan_approval = true             # en assisted, le plan attend le Director ; le champ `Plan approval` d'une issue l'emporte

[workshop]
# Le Workshop en autopilot publie ce qu'il cadre en `proposed` : le Director l'accepte (champ `Ballet status` à `ready`) avant
# que ça entre dans la file. Les types listés ici (`Feature`, `Bug`, `Task`) sautent cette étape : ils sortent `ready` d'emblée.
queue_approval_skipped = []

[escalation]
max_round_trips = 2              # allers-retours Dancer ↔ Critic
max_exchange_rounds = 3          # tours de questions entre deux rôles sur un même sujet (message.md)
max_diff_lines = 1500            # lignes changées (ajoutées + supprimées) de la branche, comptées par le script
max_diff_strict = false          # false : au-delà, la PR porte ballet:oversized et rien ne bloque ; true : escalade avant le Critic
ci_wait_seconds = 480             # la Premiere attend une CI en cours jusque-là, puis escalade ; sous 600 (limite d'un appel du Conductor)
proof_timeout_seconds = 420       # au rapport du Dancer, le script lance la preuve du repo ; encore en cours après, escalade ; sous 600
diff_exclude = ["*.lock", "pnpm-lock.yaml", "package-lock.json"]   # hors du compte (fnmatch, `*` traverse les `/`)

# Le test de mutation, nœud après la preuve : Ballet porte la méthode, le projet l'outil. Chaque outil est une entrée
# du profil, éditée à la main par le Director :
#   [[repos.<repo>.mutation]]
#   name = "cargo-mutants"
#   command = "mise exec -- cargo mutants --in-diff {diff}"   # {diff} un fichier, {files}, {ranges} (`fichier:début-fin`)
#   config = ".cargo/mutants.toml"                            # où s'excluent les équivalents, chacun avec sa raison
#   report = { path = "mutants.out/outcomes.json", format = "cargo-mutants" }
#   paths = ["crates/*"]                                      # facultatif : le diff filtré (fnmatch, `*` traverse les `/`)
# Sans entrée, le nœud est sauté.
[mutation]
enabled = true                   # false : le nœud ne lance rien (`mutation-skipped`), les entrées du profil restent
timeout_seconds = 3600           # le budget de tous les outils, lancés en arrière-plan ; encore en cours après, escalade
